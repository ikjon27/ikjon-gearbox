# IKJON website editor settings.
# Only GitHub accounts with write access to ikjon27/ikjon-gearbox can sign in and save.
backend:
  name: github
  repo: ikjon27/ikjon-gearbox
  branch: main
  commit_messages:
    update: 'Website edit: {{slug}}'
    uploadMedia: Upload {{path}}
site_url: https://www.ikjon-gearbox.com
display_url: https://www.ikjon-gearbox.com
logo:
  src: /brand/mark-navy.png
media_folder: brand/uploads
public_folder: /brand/uploads
collections:
- name: website
  label: Website
  files:
  - name: home
    label: Home page
    file: content/site.json
    format: json
    fields:
    - name: brand
      label: Brand and logos
      widget: object
      collapsed: true
      fields:
      - name: name
        label: Brand name
        widget: string
      - name: tagline
        label: Tagline
        widget: string
        required: false
      - name: logo_header
        label: Logo in the top bar (white)
        widget: image
        required: false
      - name: logo_main
        label: Main logo (navy)
        widget: image
        required: false
      - name: logo_footer
        label: White logo (top section and footer)
        widget: image
        required: false
      - name: logo_mark
        label: Logo mark (navy)
        widget: image
        required: false
    - name: hero
      label: Top section
      widget: object
      collapsed: true
      fields:
      - name: label
        label: Small label
        widget: object
        collapsed: false
        required: false
        fields:
        - name: en
          label: English
          widget: string
          required: false
        - name: uz
          label: O'zbekcha
          widget: string
          required: false
