        collapsed: false
        fields:
        - name: en
          label: English
          widget: text
          required: false
        - name: uz
          label: O'zbekcha
          widget: text
          required: false
        name: text
        label: Short description
        required: false
      - widget: object
        collapsed: true
        fields:
        - name: en
          label: Button text (English)
          widget: string
          required: false
        - name: uz
          label: Button text (O'zbekcha)
          widget: string
          required: false
        - name: link
          label: Link (e.g. /fitness/#plan=men or /rehab/#find)
          widget: string
          required: false
        name: button
        label: Button
        required: false
      - widget: object
        collapsed: true
