# IKJON website editor settings.
# Only GitHub accounts with write access to ikjon27/ikjon-gearbox can sign in and save.
backend:
  name: github
  repo: ikjon27/ikjon-gearbox
  branch: main
  commit_messages:
    update: 'Website edit: {{slug}}'
    uploadMedia: Upload {{path}}
site_url: https://www.ikjon-gearbox.com
display_url: https://www.ikjon-gearbox.com
logo:
  src: /brand/mark-navy.png
media_folder: brand/uploads
public_folder: /brand/uploads
collections:
- name: website
  label: Website
  files:
  - name: home
    label: Home page
    file: content/site.json
    format: json
    fields:
    - name: brand
      label: Brand and logos
      widget: object
      fields:
      - name: name
        label: Brand name
        widget: string
        required: true
      - name: tagline
        label: Tagline
        widget: string
        required: false
      - name: logo_header
        label: Logo in the top bar (white)
        widget: image
        required: false
      - name: logo_main
        label: Main logo (hero)
        widget: image
        required: false
      - name: logo_footer
        label: Footer logo (white)
        widget: image
        required: false
      - name: logo_mark
        label: Logo mark in 'Our logo' section
        widget: image
        required: false
    - name: sections
      label: Sections to show on the website
      hint: Switch a section on when its content is ready. Hidden sections keep their content saved.
      widget: object
      fields:
      - name: goals
        label: What are you looking for? (goal buttons)
        widget: boolean
        default: true
        required: false
      - name: facts
        label: Numbers strip
        widget: boolean
        default: false
        required: false
      - name: areas
        label: What we do (areas and services)
        widget: boolean
        default: false
        required: false
      - name: logo
        label: Our logo, explained
        widget: boolean
        default: false
        required: false
      - name: apps
        label: Apps
        widget: boolean
        default: false
        required: false
      - name: principles
        label: How we work
        widget: boolean
        default: false
        required: false
      required: false
    - name: goals_intro
      label: '''What are you looking for?'' heading'
      widget: object
      collapsed: true
      fields:
      - widget: object
        collapsed: false
        fields:
        - name: en
          label: English
          widget: string
          required: false
        - name: uz
          label: O'zbekcha
          widget: string
          required: false
        name: label
        label: Small label
        required: false
      - widget: object
        collapsed: false
        fields:
        - name: en
          label: English
          widget: string
          required: false
        - name: uz
          label: O'zbekcha
          widget: string
          required: false
        name: title
        label: Heading
        required: false
      - widget: object
        collapsed: false
        fields:
        - name: en
          label: English
          widget: text
          required: false
        - name: uz
          label: O'zbekcha
          widget: text
          required: false
        name: text
        label: Introduction
        required: false
      required: false
    - name: goals
      label: Goal buttons (visitor picks what they need)
      hint: Each card sends visitors to the right app. Links like /fitness/#plan=men open a plan directly; /rehab/#find opens the rehab plan finder.
      widget: list
      summary: '{{fields.title.en}}'
      fields:
      - name: icon
        label: Emoji icon
        widget: string
        required: false
      - widget: object
        collapsed: false
        fields:
        - name: en
          label: English
          widget: string
          required: false
        - name: uz
          label: O'zbekcha
          widget: string
          required: false
        name: title
        label: Title
        required: false
