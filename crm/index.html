<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#D9711F">
<title>IKJON CRM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IKJON CRM">
<style>
  html,body{margin:0;height:100%;background:#fff;overflow:hidden}
  #crm{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#F6F4EE}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#fff;font:600 15px Calibri,Candara,"Segoe UI",system-ui,sans-serif;color:#1A4264;transition:opacity .3s}
  #splash img{width:120px;height:auto}
  #splash.gone{opacity:0;pointer-events:none}
  #offline{display:none;position:fixed;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:12px;padding:24px;text-align:center;background:#fff;font:15px Calibri,Candara,"Segoe UI",system-ui,sans-serif;color:#1A4264}
  #offline button{border:0;border-radius:10px;background:#D9711F;color:#fff;font:700 15px inherit;padding:12px 22px}
</style>
</head>
<body>
<div id="splash"><img src="icons/icon-192.png" alt="IKJON"><div>IKJON CRM</div></div>
<div id="offline"><img src="icons/icon-192.png" alt="" width="96"><b>No internet connection</b><div>Connect to the internet, then try again. / Internetga ulaning va qayta urinib ko'ring.</div><button onclick="location.reload()">Try again / Qayta urinish</button></div>
<iframe id="crm" title="IKJON CRM" allow="clipboard-write" src="https://script.google.com/macros/s/AKfycbxmgamTpbd-c0jfkY722cZai4bPxwugTjUENAZzQgRvkoqN2nlhuNRhQZinuHwyrvbHgg/exec"></iframe>
<script>
  var f=document.getElementById('crm'), s=document.getElementById('splash');
  f.addEventListener('load',function(){ s.classList.add('gone'); });
  setTimeout(function(){ s.classList.add('gone'); }, 8000);
  if(!navigator.onLine){ document.getElementById('offline').style.display='flex'; }
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
