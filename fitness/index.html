or skin, hair and sleep.":"Kuchli dumba va oyoqlar, aniq bel chizig‘i, tarang qo‘llar va tik qomatni uyda, o‘z sur’atingizda shakllantiring. Kundalik boshdan-oyoqqacha parvarish va teri, soch, uyqu uchun odatlar kiritilgan.","Hair & Scalp Care":"Soch va bosh terisi parvarishi","Men & women · 30 days · 7 min + a walk":"Erkak va ayollar · 30 kun · 7 daqiqa + sayr","Daily scalp massage, stress-lowering breathing, neck release, a brisk walk and the food and care habits that support healthy hair. Honest note: no exercise can reverse genetic hair loss — this plan supports your hair and tells you when to see a doctor.":"Har kungi bosh terisini uqalash, stressni kamaytiruvchi nafas, bo‘yinni bo‘shashtirish, tez yurish va sog‘lom sochni qo‘llab-quvvatlovchi ovqatlanish va parvarish odatlari. Rostini aytganda: hech bir mashq irsiy soch to‘kilishini to‘xtata olmaydi — bu reja sochingizni qo‘llab-quvvatlaydi va qachon shifokorga borish kerakligini aytadi.","Face, Neck & Posture":"Yuz, bo‘yin va qomat","Men & women · 30 days · 15 min":"Erkak va ayollar · 30 kun · 15 daqiqa","Stand taller and look fresher: face and jaw exercises, eye breaks, neck and upper-back strength, plus sun protection and sleep habits.":"Qaddingizni tik tuting va tetikroq ko‘rining: yuz va jag‘ mashqlari, ko‘z tanaffuslari, bo‘yin va yuqori orqa kuchi, shuningdek quyoshdan himoya va uyqu odatlari.","Month 1 · Foundation":"1-oy · Asos","Month 2 · Build":"2-oy · Rivojlantirish","Month 3 · Sculpt":"3-oy · Shakllantirish","Beginner":"Boshlang‘ich","Regular":"O‘rta","Active":"Faol"},"ru":{"Hair & scalp":"Волосы и кожа головы","Face & jaw":"Лицо и челюсть","Eyes":"Глаза","Teeth & mouth":"Зубы и рот","Neck & posture":"Шея и осанка","Shoulders, arms & chest":"Плечи, руки и грудь","Back":"Спина","Core & waist":"Пресс и талия","Hips & glutes":"Бёдра и ягодицы","Legs":"Ноги","Feet & toes":"Стопы и пальцы ног","Hands & nails":"Кисти и ногти","Skin":"Кожа","Heart & lungs":"Сердце и лёгкие","Pelvic floor":"Мышцы тазового дна","Sleep & mind":"Сон и психика","Exercise cannot reverse genetic (pattern) hair loss. What it can do is support healthy hair: lower stress, better sleep and good blood flow.":"Упражнения не могут остановить наследственное (андрогенное) выпадение волос. Но они поддерживают здоровье волос: снижают стресс, улучшают сон и кровоток.","Daily scalp massage: in small studies, about 4 minutes a day for 6 months made hair a little thicker. It is free and safe — be consistent.":"Ежедневный массаж кожи головы: в небольших исследованиях около 4 минут в день в течение 6 месяцев немного увеличивали густоту волос. Это бесплатно и безопасно — главное регулярность.","Eat enough protein, iron and zinc (meat, eggs, beans, lentils, greens). Crash diets often cause hair shedding 2–3 months later.":"Ешьте достаточно белка, железа и цинка (мясо, яйца, фасоль, чечевица, зелень). Жёсткие диеты часто вызывают выпадение волос через 2–3 месяца.","Be gentle: avoid tight ponytails, braids and buns, very hot dryers and harsh chemicals.":"Будьте бережны: избегайте тугих хвостов, кос и пучков, очень горячего фена и агрессивной химии.","Proven treatments for pattern hair loss (such as minoxidil, and finasteride for men) need advice from a doctor or pharmacist. See a doctor if hair falls out suddenly, in patches, or with an itchy, scaly scalp.":"Доказанные методы лечения андрогенного выпадения (например, миноксидил, а у мужчин финастерид) требуют консультации врача или фармацевта. Обратитесь к врачу, если волосы выпадают внезапно, очагами или кожа головы зудит и шелушится.","Face exercises are a small, low-risk habit. One small study found daily facial exercises for 20 weeks made cheeks look slightly fuller. The biggest factors for skin are sun protection, sleep and not smoking.":"Упражнения для лица — небольшая и безопасная привычка. В одном небольшом исследовании ежедневные упражнения в течение 20 недель сделали щёки немного полнее. Важнее всего для кожи — защита от солнца, сон и отказ от курения.","Relax the jaw during the day: teeth apart, lips together, tongue resting on the roof of the mouth. Clenching can cause jaw pain and headaches.":"Расслабляйте челюсть в течение дня: зубы разомкнуты, губы сомкнуты, язык лежит на нёбе. Сжатие зубов может вызывать боль в челюсти и головную боль.","Use the 20-20-20 rule: every 20 minutes of screen time, look at something about 6 metres (20 feet) away for 20 seconds.":"Правило 20-20-20: каждые 20 минут за экраном смотрите 20 секунд на предмет примерно в 6 метрах.","Eye exercises ease tiredness but do not fix short-sightedness. Spending time outdoors in daylight helps protect children's eyesight. Get your eyes checked every 1–2 years.":"Упражнения для глаз снимают усталость, но не исправляют близорукость. Время на улице при дневном свете помогает защитить зрение детей. Проверяйте зрение каждые 1–2 года.","Brush twice a day for 2 minutes with fluoride toothpaste, and clean between your teeth once a day. A healthy smile is one of the most attractive things you can have.":"Чистите зубы дважды в день по 2 минуты пастой с фтором и раз в день чистите между зубами. Здоровая улыбка — одно из самых привлекательных качеств.","Limit sugary drinks and snacks between meals. See a dentist every 6–12 months.":"Ограничьте сладкие напитки и перекусы между едой. Посещайте стоматолога каждые 6–12 месяцев.","Good posture is mostly strength and habit: strong upper-back muscles, chin gently tucked, screen at eye level. Change position every 30–45 minutes.":"Хорошая осанка — это в основном сила и привычка: сильные мышцы верхней части спины, подбородок слегка втянут, экран на уровне глаз. Меняйте позу каждые 30–45 минут.","Push-ups, rows and presses build strong shoulders and arms. Train them 2–3 times a week and add reps or sets slowly.":"Отжимания, тяги и жимы делают плечи и руки сильными. Тренируйте их 2–3 раза в неделю и постепенно добавляйте повторы или подходы.","A strong back protects you from pain and makes you stand taller. Balance every pushing exercise with a pulling exercise (rows, Y-raises).":"Сильная спина защищает от боли и помогает держаться прямо. Уравновешивайте каждое жимовое упражнение тяговым (тяги, подъёмы «Y»).","You cannot burn fat from one spot. A slimmer waist comes from overall activity, good food and sleep; core exercises make the muscles underneath strong and support your back.":"Нельзя сжечь жир в одном месте. Тонкая талия — результат общей активности, питания и сна; упражнения на пресс укрепляют мышцы под жиром и поддерживают спину.","Strong glutes improve your shape, posture and running, and protect the knees and back. Bridges, squats and side-lying work are the base.":"Сильные ягодицы улучшают форму, осанку и бег, защищают колени и спину. Основа — мостики, приседания и упражнения лёжа на боку.","Leg muscles are the biggest in the body — training them raises your energy use and keeps you strong as you age.":"Мышцы ног — самые крупные в теле: их тренировка увеличивает расход энергии и сохраняет силу с возрастом.","Strong feet and toes improve balance and help prevent heel and arch pain. Train them barefoot for a few minutes a day.":"Сильные стопы и пальцы улучшают равновесие и помогают избежать боли в пятке и своде. Тренируйте их босиком несколько минут в день.","Foot care: wash and dry well between the toes, moisturise dry heels, wear shoes that fit, and change socks daily.":"Уход за ногами: мойте и хорошо вытирайте между пальцами, увлажняйте сухие пятки, носите подходящую обувь и меняйте носки каждый день.","Toenails: cut straight across, not too short, and do not dig into the corners — this prevents ingrown nails. See a doctor for thick, yellow or painful nails.":"Ногти на ногах: стригите прямо, не слишком коротко, не вырезайте уголки — это предотвращает врастание. При толстых, жёлтых или болезненных ногтях обратитесь к врачу.","Grip strength is linked with good long-term health. Squeeze, spread and stretch your fingers every day.":"Сила хвата связана с хорошим здоровьем в долгосрочной перспективе. Каждый день сжимайте, разводите и растягивайте пальцы.","Nails: keep them short and clean, moisturise the cuticles instead of cutting them, and avoid biting. Nails reflect nutrition — eat enough protein and iron.":"Ногти: держите их короткими и чистыми, увлажняйте кутикулу вместо обрезания, не грызите ногти. Ногти отражают питание — ешьте достаточно белка и железа.","Sunscreen (SPF 30+) on the face and neck every day is the most proven way to keep skin looking young. Add water, sleep and vegetables.":"Ежедневный солнцезащитный крем (SPF 30+) на лицо и шею — самый доказанный способ сохранить кожу молодой. Добавьте воду, сон и овощи.","Exercise improves blood flow to the skin. Wash your face after sweating. See a doctor about a mole that changes shape, colour or size.":"Упражнения улучшают кровоток в коже. Умывайтесь после того, как вспотели. Покажите врачу родинку, которая меняет форму, цвет или размер.","Adults need at least 150 minutes a week of brisk activity (like fast walking) or 75 minutes of hard activity, plus muscle training on 2 days.":"Взрослым нужно не менее 150 минут в неделю умеренной активности (например, быстрой ходьбы) или 75 минут интенсивной, плюс силовые упражнения 2 дня в неделю.","Slow belly breathing calms the body and can lower stress. Stop and get help if you have chest pain, fainting or unusual breathlessness.":"Медленное дыхание животом успокаивает тело и снижает стресс. Остановитесь и обратитесь за помощью при боли в груди, обмороке или необычной одышке.","Pelvic floor training is proven for both women and men: it helps bladder control, supports the core and can improve sexual health.":"Тренировка тазового дна доказанно полезна и женщинам, и мужчинам: помогает контролю мочевого пузыря, поддерживает кор и может улучшить сексуальное здоровье.","During pregnancy or after giving birth, ask your doctor or midwife which exercises are right for you.":"Во время беременности и после родов спросите врача или акушерку, какие упражнения вам подходят.","Most adults need 7–9 hours of sleep. Sleep is when muscles repair, skin renews and hormones balance — it is part of your training.":"Большинству взрослых нужно 7–9 часов сна. Во сне восстанавливаются мышцы, обновляется кожа и уравновешиваются гормоны — это часть тренировки.","Same bedtime every day, a dark cool room, and screens off 30 minutes before bed. If you feel low for weeks, talk to someone you trust or a doctor.":"Ложитесь в одно и то же время, в тёмной прохладной комнате, выключайте экраны за 30 минут до сна. Если подавленное настроение длится неделями, поговорите с близким человеком или врачом.","Scalp massage":"Массаж кожи головы","Scalp blood flow, relaxation":"Кровоток в коже головы, расслабление","Place your fingertips (not nails) on the scalp.":"Положите подушечки пальцев (не ногти) на кожу головы.","Press firmly and move the skin in small circles — do not just rub the hair.":"Плотно надавите и двигайте кожу маленькими кругами — не просто трите волосы.","Work from the front hairline to the crown, the sides and the back of the head.":"Двигайтесь от линии роста волос надо лбом к макушке, по бокам и к затылку.","Keep going for the full time, breathing slowly.":"Продолжайте всё время, дыша медленно.","Do it every day — results in studies took about 6 months.":"Делайте каждый день — в исследованиях результат появлялся примерно через 6 месяцев.","Neck & upper-shoulder release":"Расслабление шеи и верха плеч","Tension around the head and neck":"Напряжение вокруг головы и шеи","Sit tall and drop your shoulders.":"Сядьте прямо и опустите плечи.","Tilt your ear towards one shoulder and hold.":"Наклоните ухо к одному плечу и задержитесь.","Gently press the tight muscle at the top of the shoulder with the other hand. Switch sides.":"Другой рукой мягко надавите на напряжённую мышцу сверху плеча. Смените сторону.","Gentle stretch only — no pain.":"Только мягкое растяжение — без боли.","Cheek lifter":"Подъём щёк","Cheek and smile muscles":"Мышцы щёк и улыбки","Open your mouth into a long \"O\", lips covering the teeth.":"Откройте рот вытянутой буквой «О», губы закрывают зубы.","Smile with the upper cheeks to lift them up.":"Улыбнитесь верхней частью щёк, приподнимая их.","Place your fingers lightly on the cheeks and hold, then relax.":"Слегка положите пальцы на щёки, задержитесь и расслабьтесь.","Keep the forehead relaxed.":"Лоб остаётся расслабленным.","Jaw relax & open":"Расслабление и открывание челюсти","Jaw muscles, clenching":"Жевательные мышцы, сжатие зубов","Rest the tip of your tongue behind the top teeth.":"Положите кончик языка за верхние зубы.","Slowly open your mouth as far as is comfortable, keeping the tongue there.":"Медленно откройте рот насколько удобно, не отрывая язык.","Close slowly. Then massage the jaw muscle in front of the ear in circles.":"Медленно закройте. Затем помассируйте жевательную мышцу перед ухом круговыми движениями.","Stop if the jaw clicks painfully.":"Остановитесь, если челюсть болезненно щёлкает.","Forehead smoother":"Разглаживание лба","Forehead and frown lines":"Лоб и межбровные морщины","Place your fingertips flat on the forehead.":"Положите подушечки пальцев плоско на лоб.","Gently glide them out towards the temples, smoothing the skin.":"Мягко ведите их к вискам, разглаживая кожу.","Relax the eyebrows completely between strokes.":"Между движениями полностью расслабляйте брови.","Use a little moisturiser so the fingers glide.":"Нанесите немного крема, чтобы пальцы скользили.","Chin & neck lift":"Подъём подбородка и шеи","Front of the neck, jawline":"Передняя поверхность шеи, линия челюсти","Sit tall and look up towards the ceiling.":"Сядьте прямо и посмотрите на потолок.","Push your lower lip over the upper lip (or press the tongue to the roof of the mouth).":"Выдвиньте нижнюю губу на верхнюю (или прижмите язык к нёбу).","Feel the front of the neck work. Hold, then return slowly.":"Почувствуйте работу передней поверхности шеи. Задержитесь и медленно вернитесь.","Skip it if looking up makes you dizzy.":"Пропустите, если при взгляде вверх кружится голова.","Smile hold":"Удержание улыбки","Mouth corners, cheeks":"Уголки рта, щёки","Smile widely with the lips closed.":"Широко улыбнитесь с сомкнутыми губами.","Pull the corners of the mouth up and back. Hold.":"Потяните уголки рта вверх и назад. Задержитесь.","Relax fully, then repeat.":"Полностью расслабьтесь и повторите.","A real smile also makes you look more approachable.":"Искренняя улыбка также делает вас приветливее.","Near–far focus":"Фокус ближе–дальше","Eye focusing muscles, screen tiredness":"Мышцы фокусировки, усталость от экрана","Hold your thumb about 25 cm in front of your face.":"Держите большой палец примерно в 25 см от лица.","Focus on it for a few seconds.":"Сфокусируйтесь на нём несколько секунд.","Then focus on something far away (6 m or more). Switch back and forth.":"Затем посмотрите на что-то далёкое (6 м и дальше). Чередуйте.","Blink normally — screens make us blink less.":"Моргайте как обычно — у экрана мы моргаем реже.","Eye movements":"Движения глазами","Eye muscles":"Глазные мышцы","Keep your head still.":"Держите голову неподвижно.","Look up, down, left and right slowly, pausing at each end.":"Медленно смотрите вверх, вниз, влево и вправо, задерживаясь в каждой точке.","Then draw slow circles with your eyes, both directions.":"Затем медленно рисуйте глазами круги в обе стороны.","Gentle — stop if it causes dizziness.":"Мягко — остановитесь, если кружится голова.","Palming":"Пальминг","Eye rest, relaxation":"Отдых глаз, расслабление","Rub your palms together to warm them.":"Потрите ладони, чтобы согреть их.","Cup them over your closed eyes without pressing.":"Накройте ими закрытые глаза, не надавливая.","Breathe slowly and enjoy the darkness.":"Дышите медленно и отдыхайте в темноте.","Great after long screen time.":"Отлично после долгой работы за экраном.","2-minute brush & floss":"2 минуты чистки и нить","Teeth and gums":"Зубы и дёсны","Brush all surfaces of the teeth for 2 minutes with fluoride toothpaste.":"Чистите все поверхности зубов 2 минуты пастой с фтором.","Brush gently along the gum line in small circles.":"Мягко чистите вдоль линии дёсен маленькими кругами.","Clean between the teeth with floss or small brushes. Spit, don't rinse.":"Почистите между зубами нитью или ёршиком. Сплюньте, не полощите.","Brush your tongue too for fresh breath.":"Чистите и язык для свежего дыхания.","Belly breathing":"Дыхание животом","Diaphragm, stress":"Диафрагма, стресс","Sit or lie comfortably, one hand on the chest, one on the belly.":"Сядьте или лягте удобно, одна рука на груди, другая на животе.","Breathe in through the nose for 4 seconds — only the belly hand rises.":"Вдохните через нос на 4 секунды — поднимается только рука на животе.","Breathe out slowly through the mouth for 6 seconds.":"Медленно выдохните ртом за 6 секунд.","A longer out-breath calms the body.":"Длинный выдох успокаивает тело.","Box breathing":"Квадратное дыхание","Calm, focus":"Спокойствие, концентрация","Breathe in through the nose for 4 seconds.":"Вдохните через нос на 4 секунды.","Hold for 4 seconds.":"Задержите дыхание на 4 секунды.","Breathe out for 4 seconds, then hold for 4 seconds. Repeat.":"Выдохните за 4 секунды и задержитесь на 4 секунды. Повторяйте.","Use it before an exam, an interview or sleep.":"Используйте перед экзаменом, собеседованием или сном.","Pelvic floor squeeze (Kegel)":"Сжатие тазового дна (Кегель)","Pelvic floor muscles":"Мышцы тазового дна","Sit or lie comfortably. Find the muscles you would use to stop passing urine and wind.":"Сядьте или лягте удобно. Найдите мышцы, которыми вы останавливаете мочеиспускание и газы.","Squeeze and lift them inwards. Hold for the count, breathing normally.":"Сожмите и подтяните их внутрь и вверх. Удерживайте, дыша как обычно.","Relax fully for the same time. Then do 10 quick squeezes.":"Полностью расслабьтесь на такое же время. Затем сделайте 10 быстрых сжатий.","Don't squeeze the buttocks or hold your breath. Don't practise while actually urinating.":"Не сжимайте ягодицы и не задерживайте дыхание. Не тренируйтесь во время мочеиспускания.","Finger spread & squeeze":"Разведение и сжатие пальцев","Hand muscles, grip":"Мышцы кисти, хват","Make a tight fist and hold for 2 seconds.":"Крепко сожмите кулак на 2 секунды.","Open and spread the fingers as wide as you can.":"Раскройте и максимально разведите пальцы.","Touch each fingertip to the thumb in turn.":"По очереди касайтесь каждым пальцем большого пальца.","Squeeze a soft ball or rolled towel to make it harder.":"Сжимайте мягкий мяч или свёрнутое полотенце, чтобы усложнить.","Wrist circles & stretch":"Круги и растяжка запястий","Wrists, forearms":"Запястья, предплечья","Make slow circles with both wrists, 10 each way.":"Медленно вращайте обоими запястьями по 10 раз в каждую сторону.","Hold one arm straight, palm up, and gently pull the fingers back.":"Вытяните одну руку ладонью вверх и мягко потяните пальцы назад.","Then palm down and pull the hand down. Switch arms.":"Затем ладонью вниз потяните кисть вниз. Смените руку.","Good for phone and computer users.":"Полезно тем, кто много пользуется телефоном и компьютером.","Toe spread & lift":"Разведение и подъём пальцев ног","Toes, foot arch":"Пальцы ног, свод стопы","Sit with bare feet flat on the floor.":"Сядьте, босые стопы стоят на полу.","Spread all your toes as wide as possible and hold.":"Разведите все пальцы как можно шире и задержитесь.","Relax, then lift all toes up while the ball of the foot stays down.":"Расслабьте, затем поднимите все пальцы, подушечка стопы остаётся на полу.","Use your hands to help at first.":"Поначалу помогайте руками.","Knee push-up":"Отжимания с колен","Chest, arms, core":"Грудь, руки, кор","Kneel with hands under the shoulders.":"Встаньте на колени, руки под плечами.","Keep a straight line from knees to head.":"Держите прямую линию от колен до головы.","Lower the chest towards the floor, then push back up.":"Опустите грудь к полу и оттолкнитесь вверх.","When 3 × 12 is easy, try full push-ups.":"Когда 3 × 12 даётся легко, переходите к обычным отжиманиям.","Pike push-up":"Отжимания в складке","Shoulders, triceps":"Плечи, трицепс","Start in a push-up position and walk your feet in so the hips go up into an upside-down V.":"Из упора лёжа подойдите ногами ближе, подняв таз в перевёрнутую «V».","Bend the elbows and lower the top of the head towards the floor.":"Согните локти и опустите макушку к полу.","Push back up.":"Оттолкнитесь обратно вверх.","Shorter range is fine at first.":"Поначалу можно с меньшей амплитудой.","Chair dip":"Отжимания от стула","Triceps, shoulders":"Трицепс, плечи","Sit on the edge of a stable chair, hands next to your hips.":"Сядьте на край устойчивого стула, руки рядом с бёдрами.","Slide your bottom off the chair, knees bent.":"Сдвиньтесь с сиденья, колени согнуты.","Bend the elbows to lower yourself a little, then push back up.":"Согните локти, немного опуститесь и выжмите себя вверх.","Keep the shoulders down; stop if the front of the shoulder hurts.":"Плечи опущены; остановитесь, если болит передняя часть плеча.","Sumo squat":"Сумо-приседание","Glutes, inner thighs":"Ягодицы, внутренняя поверхность бедра","Stand with feet wide, toes turned out.":"Поставьте ноги широко, носки развёрнуты наружу.","Sit down between your heels with the chest up.":"Опуститесь между пятками, грудь поднята.","Push through the heels to stand and squeeze the glutes.":"Поднимитесь, отталкиваясь пятками, и сожмите ягодицы.","Knees follow the line of the toes.":"Колени смотрят туда же, куда носки.","Fire hydrant":"Отведение ноги на четвереньках","Side glutes":"Боковые ягодичные мышцы","On hands and knees, back flat.":"Встаньте на четвереньки, спина ровная.","Lift one bent knee out to the side to hip height.":"Отведите согнутое колено в сторону до уровня таза.","Lower slowly. Finish all reps, then switch sides.":"Медленно опустите. Выполните все повторы и смените сторону.","Don't lean away — keep the hips level.":"Не заваливайтесь — таз ровно.","High knees":"Бег с высоким подниманием колен","Heart rate, legs":"Пульс, ноги","Run on the spot, lifting the knees to hip height.":"Бегите на месте, поднимая колени до уровня таза.","Land softly on the balls of the feet.":"Приземляйтесь мягко на подушечки стоп.","Pump the arms.":"Активно работайте руками.","Low-impact version: march fast instead.":"Щадящий вариант: быстрая ходьба на месте.","Burpee":"Бёрпи","Whole body, heart rate":"Всё тело, пульс","Squat down and put your hands on the floor.":"Присядьте и поставьте руки на пол.","Step or jump the feet back to a plank, then bring them back in.":"Шагните или прыгните ногами назад в планку, затем верните их.","Stand up and reach the arms overhead (add a small jump if you can).":"Встаньте и потянитесь руками вверх (если можете, добавьте прыжок).","Step back instead of jumping to make it easier.":"Для облегчения шагайте, а не прыгайте.","Lying leg raise":"Подъём ног лёжа","Lower abs":"Нижний пресс","Lie on your back, hands under your lower back or by your sides.":"Лягте на спину, руки под поясницей или вдоль тела.","Keep the low back pressed down and lift both legs up.":"Прижмите поясницу к полу и поднимите обе ноги.","Lower them slowly without the back arching.":"Медленно опустите, не прогибая поясницу.","Bend the knees to make it easier.":"Согните колени, чтобы было легче.","Progress check":"Проверка прогресса","Motivation":"Мотивация","Take a photo in the same place and light each week (front and side).":"Каждую неделю фотографируйтесь в одном месте и при одном свете (спереди и сбоку).","Optional: measure your waist at the belly button.":"По желанию: измерьте талию на уровне пупка.","Compare month to month, not day to day.":"Сравнивайте по месяцам, а не по дням.","Photos stay in your own phone gallery — the app never sees them.":"Фото остаются в галерее вашего телефона — приложение их не видит.","Push-up":"Отжимания","Too hard? Start with wall push-ups.":"Слишком тяжело? Начните с отжиманий от стены.","Strength":"Сила","Hands under shoulders, body in a straight line (knees down to make it easier).":"Руки под плечами, тело прямое (для облегчения — с колен).","Lower the chest towards the floor.":"Опустите грудь к полу.","Push back up without the hips sagging.":"Оттолкнитесь вверх, не провисая тазом.","Dumbbell shoulder press":"Жим гантелей над головой","Overhead strength":"Сила над головой","Start light; pain should stay 3/10 or lower.":"Начинайте с лёгкого веса; боль не выше 3/10.","Sit or stand with light dumbbells at shoulder height.":"Сядьте или встаньте с лёгкими гантелями на уровне плеч.","Press up in a pain-free arc.":"Выжимайте вверх по безболезненной дуге.","Lower over 3 s.":"Опускайте за 3 с.","Bent-over row":"Тяга в наклоне","Upper back, shoulder blades":"Верхняя часть спины, лопатки","Keep the neck long and the back flat.":"Шея вытянута, спина прямая.","Hinge forward with a flat back, weights or band in hands.":"Наклонитесь вперёд с прямой спиной, гантели или резина в руках.","Pull the elbows back, squeezing the shoulder blades.":"Тяните локти назад, сводя лопатки.","Lower slowly.":"Опускайте медленно.","Prone T & Y raise":"Подъёмы T и Y лёжа на животе","Lower & middle trapezius":"Нижняя и средняя часть трапециевидной мышцы","Small lift, no shrugging.":"Небольшой подъём, не поднимайте плечи к ушам.","Lie face down on a bench or the floor.":"Лягте лицом вниз на скамью или пол.","Lift the arms out to a 'T', then up to a 'Y', thumbs up.":"Поднимите руки в стороны буквой «T», затем вверх буквой «Y», большие пальцы вверх.","Band pull-apart":"Разведение резины","Rear shoulder, upper back":"Задняя часть плеча, верх спины","Ribs down, don't arch the back.":"Рёбра вниз, не прогибайте спину.","Hold a band at shoulder height, arms straight.":"Держите резину на уровне плеч прямыми руками.","Pull the band apart to touch the chest.":"Растяните резину до касания груди.","Return slowly.":"Медленно вернитесь.","Superman":"«Супермен»","Back extensors, glutes":"Разгибатели спины, ягодицы","Small lift is enough — no cranking the neck.":"Небольшого подъёма достаточно — не запрокидывайте шею.","Core":"Кор","Lie face down, arms overhead.":"Лягте лицом вниз, руки над головой.","Lift arms, chest and legs slightly off the floor.":"Слегка поднимите руки, грудь и ноги от пола.","Hold 3 s, lower slowly.":"Удерживайте 3 с, медленно опустите.","Wall slide":"Скольжение по стене","Overhead control":"Контроль над головой","Stop below the point of pain.":"Останавливайтесь ниже точки боли.","Mobility":"Подвижность","Forearms on a wall, elbows at shoulder height.":"Предплечья на стене, локти на уровне плеч.","Slide arms up the wall in a pain-free range.":"Скользите руками вверх по стене в безболезненной амплитуде.","Slide back down slowly.":"Медленно скользите вниз.","Chin tuck":"Втягивание подбородка","Deep neck flexors":"Глубокие сгибатели шеи","Don't nod down — slide straight back.":"Не кивайте вниз — сдвигайте прямо назад.","Isometric":"Изометрия","Sit or stand tall, eyes level.":"Сядьте или встаньте прямо, взгляд вперёд.","Glide the chin straight back (make a 'double chin').":"Сдвиньте подбородок прямо назад («двойной подбородок»).","Hold 5 s, relax.":"Удерживайте 5 с, расслабьтесь.","Neck mobility":"Подвижность шеи","Neck range of motion":"Амплитуда движений шеи","Great break from phone and desk work.":"Отличный перерыв от телефона и работы за столом.","Sit or stand tall.":"Сядьте или встаньте ровно.","Slowly nod down and up, then turn left and right.":"Медленно кивните вниз и вверх, затем поверните голову влево и вправо.","Move in a comfortable range.":"Двигайтесь в комфортной амплитуде.","Open book":"«Открытая книга»","Upper back rotation":"Вращение верхней части спины","Breathe out as you open.":"Выдыхайте при раскрытии.","Lie on your side, knees bent, arms together in front.":"Лягте на бок, колени согнуты, руки вместе перед собой.","Open the top arm across to the other side, following it with your eyes.":"Откройте верхнюю руку на другую сторону, следя за ней глазами.","Seated upper-back extension":"Разгибание верхней части спины сидя","Upper back mobility":"Подвижность верхней части спины","Move from the upper back, not the low back.":"Двигайтесь верхней частью спины, а не поясницей.","Sit on a chair, hands behind your head.":"Сядьте на стул, руки за головой.","Gently arch the upper back over the chair back, looking up.":"Мягко прогните верхнюю часть спины через спинку стула, глядя вверх.","Return to upright.":"Вернитесь в вертикальное положение.","Doorway chest stretch":"Растяжка груди в дверном проёме","Chest, front of shoulder":"Грудь, передняя часть плеча","Undoes rounded 'phone posture'.":"Исправляет сутулую «позу с телефоном».","Stretch":"Растяжка","Forearm on a door frame, elbow at shoulder height.":"Предплечье на дверной раме, локоть на уровне плеча.","Step through gently until you feel the chest stretch.":"Мягко шагните вперёд, пока не почувствуете растяжение в груди.","Hold, then switch sides.":"Удерживайте, затем смените сторону.","Arm circles":"Круги руками","Shoulder warm-up":"Разминка плеч","Keep the shoulders down away from the ears.":"Держите плечи опущенными, подальше от ушей.","Arms out to the sides.":"Руки в стороны.","Make slow circles forward, then backward.":"Медленные круги вперёд, затем назад.","Grow the circles gradually.":"Постепенно увеличивайте круги.","Grip squeeze":"Сжатие кисти","Grip strength":"Сила хвата","Squeeze with the elbow straight later in rehab.":"На поздних этапах реабилитации сжимайте с прямым локтем.","Squeeze a soft ball or towel.":"Сожмите мягкий мяч или полотенце.","Hold 3–5 s.":"Удерживайте 3–5 с.","Relax fully.":"Полностью расслабьтесь.","Suitcase carry":"Прогулка с чемоданом","Core anti-side-bend":"Кор против бокового наклона","Shoulders level the whole time.":"Плечи всё время на одном уровне.","Hold a heavy weight in one hand.":"Возьмите тяжёлый груз в одну руку.","Walk tall for 20–30 m without leaning.":"Пройдите 20–30 м прямо, не наклоняясь.","Switch hands.":"Смените руку.","Forearm plank":"Планка на предплечьях","Whole core":"Весь кор","Squeeze glutes; don't let the hips sag.":"Сожмите ягодицы; не давайте тазу провисать.","Forearms on the floor, elbows under shoulders.":"Предплечья на полу, локти под плечами.","Lift into a straight line from head to heels.":"Поднимитесь в прямую линию от головы до пяток.","Hold and breathe.":"Удерживайте и дышите.","Side plank":"Боковая планка","Obliques, side of the trunk":"Косые мышцы, боковая поверхность корпуса","Head, hips, feet in one line.":"Голова, таз и стопы на одной линии.","On your side, elbow under the shoulder.":"На боку, локоть под плечом.","Knees bent first, then straight legs.":"Сначала с согнутыми коленями, затем с прямыми ногами.","Lift hips into a line and hold.":"Поднимите таз в одну линию и удерживайте.","Dead bug":"«Мёртвый жук»","Deep core control":"Глубокий контроль кора","Breathe out as the limbs lower.":"Выдыхайте, опуская конечности.","On your back, arms up, hips and knees at 90°.":"На спине, руки вверх, бёдра и колени под 90°.","Lower opposite arm and leg slowly.":"Медленно опускайте противоположные руку и ногу.","Keep the low back gently against the floor.":"Поясница мягко прижата к полу.","Bird dog":"«Птица-собака»","Back extensors, core":"Разгибатели спины, кор","Imagine a cup of tea on your lower back.":"Представьте, что на пояснице стоит чашка чая.","On hands and knees.":"Встаньте на четвереньки.","Reach opposite arm and leg out long.":"Вытяните противоположные руку и ногу.","Hold 5–10 s, don't rotate the hips.":"Удерживайте 5–10 с, не разворачивайте таз.","Cat–camel":"Кошка–верблюд","Spine mobility":"Подвижность позвоночника","Mobility, not stretching. Keep it gentle.":"Это подвижность, а не растяжка. Делайте мягко.","Slowly round the back up, then let it sag gently.":"Медленно округлите спину вверх, затем мягко прогните вниз.","Move within comfort.":"Двигайтесь в комфортных пределах.","Child's pose":"Поза ребёнка","Back, hips":"Спина, бёдра","A cushion between heels and bottom helps if knees are stiff.":"Если колени скованы, положите подушку между пятками и ягодицами.","Kneel and sit back towards your heels.":"Встаньте на колени и сядьте назад к пяткам.","Reach the arms forward on the floor.":"Вытяните руки вперёд по полу.","Relax and breathe into the back.":"Расслабьтесь и дышите в спину.","Knee to chest":"Колено к груди","Low back & glutes":"Поясница и ягодицы","Breathe out and relax the back.":"Выдохните и расслабьте спину.","Lie on your back.":"Лягте на спину.","Pull one knee to your chest with both hands.":"Подтяните одно колено к груди обеими руками.","Hold, then switch.":"Удерживайте, затем смените.","Glute bridge":"Ягодичный мост","Glutes, hamstrings":"Ягодицы, задняя поверхность бедра","Push through heels; don't arch the low back.":"Давите пятками; не прогибайте поясницу.","Lie on your back, knees bent, feet flat.":"Лягте на спину, колени согнуты, стопы на полу.","Squeeze glutes and lift hips into a straight line.":"Сожмите ягодицы и поднимите таз до прямой линии.","Single-leg bridge":"Мост на одной ноге","Hips stay level like a table.":"Таз остаётся ровным, как стол.","Bridge position, lift one foot off the floor.":"Положение моста, оторвите одну стопу от пола.","Raise hips level, not twisting.":"Поднимите таз ровно, без скручивания.","Quadruped glute kickback":"Отведение ноги назад на четвереньках","Glutes":"Ягодицы","Squeeze the glute at the top.":"Сожмите ягодицу в верхней точке.","Kick one heel back and up to hip height.":"Отведите одну пятку назад и вверх до уровня таза.","Lower slowly without arching the back.":"Опускайте медленно, не прогибая спину.","Clamshell":"«Ракушка»","Glute medius":"Средняя ягодичная мышца","Add a band above the knees for progression.":"Для усложнения добавьте резину над коленями.","Lie on your side, knees bent, heels together.":"Лягте на бок, колени согнуты, пятки вместе.","Open the top knee without rolling the pelvis back.":"Раскройте верхнее колено, не откатывая таз назад.","Side-lying hip abduction":"Отведение бедра лёжа на боку","Strong hip abductors reduce knee 'caving in'.":"Сильные отводящие мышцы бедра уменьшают «заваливание» колена внутрь.","Lie on your side, bottom knee bent.":"Лягте на бок, нижнее колено согнуто.","Lift the straight top leg slightly behind the body.":"Поднимите прямую верхнюю ногу чуть позади корпуса.","Lower slowly, toes pointing forward.":"Опускайте медленно, носок смотрит вперёд.","Band side walk":"Боковые шаги с резиной","Toes point forward; don't let the knees cave in.":"Носки вперёд; не давайте коленям заваливаться внутрь.","Band around the knees or ankles, knees slightly bent.":"Резина вокруг коленей или лодыжек, колени слегка согнуты.","Step sideways, keeping tension on the band.":"Шагайте в сторону, сохраняя натяжение резины.","10 steps one way, then back.":"10 шагов в одну сторону, затем обратно.","Lateral lunge":"Боковой выпад","Adductors, glutes":"Приводящие мышцы, ягодицы","Keep the bent knee in line with the foot.":"Согнутое колено по линии стопы.","Wide stance.":"Широкая стойка.","Shift to one side, bending that knee, other leg straight.":"Сместитесь в одну сторону, сгибая это колено, другая нога прямая.","Push back to centre.":"Вернитесь в центр.","Standing hip circles":"Круги бедром стоя","Hip mobility":"Подвижность тазобедренного сустава","Smooth and controlled.":"Плавно и подконтрольно.","Stand on one leg, hold a support.":"Встаньте на одну ногу, держитесь за опору.","Lift the other knee and draw big circles with it.":"Поднимите другое колено и рисуйте им большие круги.","10 each direction.":"По 10 в каждую сторону.","Hip flexor stretch":"Растяжка сгибателей бедра","Hip front flexibility":"Гибкость передней поверхности бедра","Breathe slowly; no bouncing.":"Дышите медленно; без пружинящих движений.","Half-kneel, back knee on a cushion.":"Полувыпад на колене, заднее колено на подушке.","Tuck the pelvis under and s const AREATIPS={"hair":["Exercise cannot reverse genetic (pattern) hair loss. What it can do is support healthy hair: lower stress, better sleep and good blood flow.","Daily scalp massage: in small studies, about 4 minutes a day for 6 months made hair a little thicker. It is free and safe — be consistent.","Eat enough protein, iron and zinc (meat, eggs, beans, lentils, greens). Crash diets often cause hair shedding 2–3 months later.","Be gentle: avoid tight ponytails, braids and buns, very hot dryers and harsh chemicals.","Proven treatments for pattern hair loss (such as minoxidil, and finasteride for men) need advice from a doctor or pharmacist. See a doctor if hair falls out suddenly, in patches, or with an itchy, scaly scalp."],"face":["Face exercises are a small, low-risk habit. One small study found daily facial exercises for 20 weeks made cheeks look slightly fuller. The biggest factors for skin are sun protection, sleep and not smoking.","Relax the jaw during the day: teeth apart, lips together, tongue resting on the roof of the mouth. Clenching can cause jaw pain and headaches."],"eyes":["Use the 20-20-20 rule: every 20 minutes of screen time, look at something about 6 metres (20 feet) away for 20 seconds.","Eye exercises ease tiredness but do not fix short-sightedness. Spending time outdoors in daylight helps protect children's eyesight. Get your eyes checked every 1–2 years."],"teeth":["Brush twice a day for 2 minutes with fluoride toothpaste, and clean between your teeth once a day. A healthy smile is one of the most attractive things you can have.","Limit sugary drinks and snacks between meals. See a dentist every 6–12 months."],"neck":["Good posture is mostly strength and habit: strong upper-back muscles, chin gently tucked, screen at eye level. Change position every 30–45 minutes."],"upper":["Push-ups, rows and presses build strong shoulders and arms. Train them 2–3 times a week and add reps or sets slowly."],"back":["A strong back protects you from pain and makes you stand taller. Balance every pushing exercise with a pulling exercise (rows, Y-raises)."],"core":["You cannot burn fat from one spot. A slimmer waist comes from overall activity, good food and sleep; core exercises make the muscles underneath strong and support your back."],"glutes":["Strong glutes improve your shape, posture and running, and protect the knees and back. Bridges, squats and side-lying work are the base."],"legs":["Leg muscles are the biggest in the body — training them raises your energy use and keeps you strong as you age."],"feet":["Strong feet and toes improve balance and help prevent heel and arch pain. Train them barefoot for a few minutes a day.","Foot care: wash and dry well between the toes, moisturise dry heels, wear shoes that fit, and change socks daily.","Toenails: cut straight across, not too short, and do not dig into the corners — this prevents ingrown nails. See a doctor for thick, yellow or painful nails."],"hands":["Grip strength is linked with good long-term health. Squeeze, spread and stretch your fingers every day.","Nails: keep them short and clean, moisturise the cuticles instead of cutting them, and avoid biting. Nails reflect nutrition — eat enough protein and iron."],"skin":["Sunscreen (SPF 30+) on the face and neck every day is the most proven way to keep skin looking young. Add water, sleep and vegetables.","Exercise improves blood flow to the skin. Wash your face after sweating. See a doctor about a mole that changes shape, colour or size."],"heart":["Adults need at least 150 minutes a week of brisk activity (like fast walking) or 75 minutes of hard activity, plus muscle training on 2 days.","Slow belly breathing calms the body and can lower stress. Stop and get help if you have chest pain, fainting or unusual breathlessness."],"pelvic":["Pelvic floor training is proven for both women and men: it helps bladder control, supports the core and can improve sexual health.","During pregnancy or after giving birth, ask your doctor or midwife which exercises are right for you."],"sleep":["Most adults need 7–9 hours of sleep. Sleep is when muscles repair, skin renews and hormones balance — it is part of your training.","Same bedtime every day, a dark cool room, and screens off 30 minutes before bed. If you feel low for weeks, talk to someone you trust or a doctor."]};
const FX={"scalp_massage":["Scalp massage","hair","Scalp blood flow, relaxation",["Place your fingertips (not nails) on the scalp.","Press firmly and move the skin in small circles — do not just rub the hair.","Work from the front hairline to the crown, the sides and the back of the head.","Keep going for the full time, breathing slowly."],"Do it every day — results in studies took about 6 months.","Care","hair"],"neck_release":["Neck & upper-shoulder release","hair","Tension around the head and neck",["Sit tall and drop your shoulders.","Tilt your ear towards one shoulder and hold.","Gently press the tight muscle at the top of the shoulder with the other hand. Switch sides."],"Gentle stretch only — no pain.","Stretch","neck"],"cheek_lift":["Cheek lifter","face","Cheek and smile muscles",["Open your mouth into a long \"O\", lips covering the teeth.","Smile with the upper cheeks to lift them up.","Place your fingers lightly on the cheeks and hold, then relax."],"Keep the forehead relaxed.","Care","face"],"jaw_relax":["Jaw relax & open","face","Jaw muscles, clenching",["Rest the tip of your tongue behind the top teeth.","Slowly open your mouth as far as is comfortable, keeping the tongue there.","Close slowly. Then massage the jaw muscle in front of the ear in circles."],"Stop if the jaw clicks painfully.","Mobility","face"],"brow_smooth":["Forehead smoother","face","Forehead and frown lines",["Place your fingertips flat on the forehead.","Gently glide them out towards the temples, smoothing the skin.","Relax the eyebrows completely between strokes."],"Use a little moisturiser so the fingers glide.","Care","face"],"chin_lift":["Chin & neck lift","face","Front of the neck, jawline",["Sit tall and look up towards the ceiling.","Push your lower lip over the upper lip (or press the tongue to the roof of the mouth).","Feel the front of the neck work. Hold, then return slowly."],"Skip it if looking up makes you dizzy.","Isometric","neck"],"smile_hold":["Smile hold","face","Mouth corners, cheeks",["Smile widely with the lips closed.","Pull the corners of the mouth up and back. Hold.","Relax fully, then repeat."],"A real smile also makes you look more approachable.","Care","face"],"eye_focus":["Near–far focus","eyes","Eye focusing muscles, screen tiredness",["Hold your thumb about 25 cm in front of your face.","Focus on it for a few seconds.","Then focus on something far away (6 m or more). Switch back and forth."],"Blink normally — screens make us blink less.","Care","eye"],"eye_circles":["Eye movements","eyes","Eye muscles",["Keep your head still.","Look up, down, left and right slowly, pausing at each end.","Then draw slow circles with your eyes, both directions."],"Gentle — stop if it causes dizziness.","Mobility","eye"],"eye_palming":["Palming","eyes","Eye rest, relaxation",["Rub your palms together to warm them.","Cup them over your closed eyes without pressing.","Breathe slowly and enjoy the darkness."],"Great after long screen time.","Care","eye"],"brush_teeth":["2-minute brush & floss","teeth","Teeth and gums",["Brush all surfaces of the teeth for 2 minutes with fluoride toothpaste.","Brush gently along the gum line in small circles.","Clean between the teeth with floss or small brushes. Spit, don't rinse."],"Brush your tongue too for fresh breath.","Care","tooth"],"belly_breath":["Belly breathing","heart","Diaphragm, stress",["Sit or lie comfortably, one hand on the chest, one on the belly.","Breathe in through the nose for 4 seconds — only the belly hand rises.","Breathe out slowly through the mouth for 6 seconds."],"A longer out-breath calms the body.","Breathing","lungs"],"box_breath":["Box breathing","heart","Calm, focus",["Breathe in through the nose for 4 seconds.","Hold for 4 seconds.","Breathe out for 4 seconds, then hold for 4 seconds. Repeat."],"Use it before an exam, an interview or sleep.","Breathing","lungs"],"kegel":["Pelvic floor squeeze (Kegel)","pelvic","Pelvic floor muscles",["Sit or lie comfortably. Find the muscles you would use to stop passing urine and wind.","Squeeze and lift them inwards. Hold for the count, breathing normally.","Relax fully for the same time. Then do 10 quick squeezes."],"Don't squeeze the buttocks or hold your breath. Don't practise while actually urinating.","Strength","pelvic"],"finger_spread":["Finger spread & squeeze","hands","Hand muscles, grip",["Make a tight fist and hold for 2 seconds.","Open and spread the fingers as wide as you can.","Touch each fingertip to the thumb in turn."],"Squeeze a soft ball or rolled towel to make it harder.","Strength","hand"],"wrist_circles":["Wrist circles & stretch","hands","Wrists, forearms",["Make slow circles with both wrists, 10 each way.","Hold one arm straight, palm up, and gently pull the fingers back.","Then palm down and pull the hand down. Switch arms."],"Good for phone and computer users.","Mobility","hand"],"toe_spread":["Toe spread & lift","feet","Toes, foot arch",["Sit with bare feet flat on the floor.","Spread all your toes as wide as possible and hold.","Relax, then lift all toes up while the ball of the foot stays down."],"Use your hands to help at first.","Mobility","foot"],"knee_pushup":["Knee push-up","upper","Chest, arms, core",["Kneel with hands under the shoulders.","Keep a straight line from knees to head.","Lower the chest towards the floor, then push back up."],"When 3 × 12 is easy, try full push-ups.","Strength","arm"],"pike_pushup":["Pike push-up","upper","Shoulders, triceps",["Start in a push-up position and walk your feet in so the hips go up into an upside-down V.","Bend the elbows and lower the top of the head towards the floor.","Push back up."],"Shorter range is fine at first.","Strength","arm"],"chair_dip":["Chair dip","upper","Triceps, shoulders",["Sit on the edge of a stable chair, hands next to your hips.","Slide your bottom off the chair, knees bent.","Bend the elbows to lower yourself a little, then push back up."],"Keep the shoulders down; stop if the front of the shoulder hurts.","Strength","arm"],"sumo_squat":["Sumo squat","glutes","Glutes, inner thighs",["Stand with feet wide, toes turned out.","Sit down between your heels with the chest up.","Push through the heels to stand and squeeze the glutes."],"Knees follow the line of the toes.","Strength","hip"],"fire_hydrant":["Fire hydrant","glutes","Side glutes",["On hands and knees, back flat.","Lift one bent knee out to the side to hip height.","Lower slowly. Finish all reps, then switch sides."],"Don't lean away — keep the hips level.","Strength","hip"],"high_knees":["High knees","heart","Heart rate, legs",["Run on the spot, lifting the knees to hip height.","Land softly on the balls of the feet.","Pump the arms."],"Low-impact version: march fast instead.","Cardio","heart"],"burpee":["Burpee","heart","Whole body, heart rate",["Squat down and put your hands on the floor.","Step or jump the feet back to a plank, then bring them back in.","Stand up and reach the arms overhead (add a small jump if you can)."],"Step back instead of jumping to make it easier.","Cardio","heart"],"leg_raise":["Lying leg raise","core","Lower abs",["Lie on your back, hands under your lower back or by your sides.","Keep the low back pressed down and lift both legs up.","Lower them slowly without the back arching."],"Bend the knees to make it easier.","Core","core"],"progress_photo":["Progress check","skin","Motivation",["Take a photo in the same place and light each week (front and side).","Optional: measure your waist at the belly button.","Compare month to month, not day to day."],"Photos stay in your own phone gallery — the app never sees them.","Care","skin"]};

function fx(id){const f=FX[id];if(f)return{id,name:f[0],area:f[1],target:f[2],steps:f[3],tip:f[4],type:f[5],icon:f[6],own:true};
 const e=EX[id];return{id,name:e[0],area:AREAOF[id]||"core",target:e[2],steps:e[3],tip:e[4],type:e[6],own:false}}
const iconSVG=(n,sz)=>`<svg viewBox="0 0 48 48" width="${sz||28}" height="${sz||28}" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||ICONS.core}</svg>`;
const iconTile=(n,cls)=>`<div class="${cls||"mini"} itile" aria-hidden="true">${iconSVG(n,cls==="demo"?96:30)}</div>`;
const visMini=id=>FX[id]?iconTile(FX[id][6],"mini"):thumb(id,"mini");
const visBig=id=>FX[id]?iconTile(FX[id][6],"demo"):demoBlock(id);
const fmtT=s=>s>=60?(s%60?`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")} ${t("min")}`:`${s/60} ${t("min")}`):`${s} ${t("sec")}`;
const ONE_SIDED=new Set(["reverse_lunge","sl_rdl","bulgarian","split_squat","step_up","side_lunge","sl_bridge","clamshell","hip_abd","fire_hydrant","glute_kickback","side_plank","bird_dog","hip_circles","hip_flexor_stretch","ham_stretch","quad_stretch","calf_stretch","knee_to_chest","open_book","sl_balance","carry"]);
const doseTxt=x=>!x.t&&!x.r?"":(x.s>1?x.s+" × ":"")+(x.t?fmtT(x.t):x.r)+(ONE_SIDED.has(x.e)?" "+t("each"):"");
const estMin=list=>Math.max(1,Math.round(list.reduce((a,x)=>a+x.s*((x.t||x.r*3.5)*(ONE_SIDED.has(x.e)?2:1))+(x.s-1)*30+15,0)/60));

/* ---------- plans & days ---------- */
const planById=id=>PLANS.find(p=>p.id===id);
const dayKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const dateOf=(p,n)=>{const [y,m,d]=p.start.split("-").map(Number);return new Date(y,m-1,d+n-1)};
function dayNum(p){const [y,m,d]=p.start.split("-").map(Number),n=new Date();return Math.round((Date.UTC(n.getFullYear(),n.getMonth(),n.getDate())-Date.UTC(y,m-1,d))/864e5)+1}
const totalDays=p=>planById(p.id).months*30;
const lvlMul=p=>(LEVELS.find(l=>l[0]===p.lvl)||LEVELS[1])[2];
function scaleList(list,p,n,care){const m=Math.floor((n-1)/30)+(p.cycle||0),w=Math.floor(((n-1)%30)/7.5);
 return list.map(([e,s,r,tm])=>{if(care||e==="walk")return{e,s,r,t:tm};
  const f=(p.adj||1)*lvlMul(p)*(1+.15*Math.min(m,3)+.05*w),ty=fx(e).type;
  const sets=s+((m>=2&&s>=3&&(ty==="Strength"||ty==="Core"))?1:0);
  return{e,s:sets,r:r?Math.max(4,Math.round(r*f)):0,t:tm?Math.round(tm*(ty==="Stretch"||ty==="Breathing"?1:f)/5)*5:0}})}
function careFor(p,n){const pl=planById(p.id),i=n-1;
 if(pl.care==="full")return CARE.map(([a,opts])=>opts[i%opts.length]);
 if(pl.care==="face"){const g=a=>CARE.find(c=>c[0]===a)[1];const f=g("face");return[f[i%f.length],f[(i+1)%f.length],g("eyes")[i%3],g("neck")[i%4],g("hair")[0]]}
 return[]}
function workFor(p,n){const pl=planById(p.id),wid=pl.week[(n-1)%7];const w=WK[wid];return{id:wid,name:w[0],icon:w[1],list:scaleList(w[2],p,n),warm:wid!=="rest"&&wid!=="hairday"&&wid!=="active"}}
function habitsFor(p,n){const pl=planById(p.id),wd=(dateOf(p,n).getDay()+6)%7;
 return pl.habits.map(k=>["h:"+k,HAB[k]]).concat((WEEKLY[wd]||[]).map((s,j)=>["w:"+j,s]))}
const dayRec=(p,n)=>{const k=dayKey(dateOf(p,n));return S.hist[k]||(S.hist[k]={})};
const peekRec=(p,n)=>S.hist[dayKey(dateOf(p,n))]||{};
function dayDone(p,n){const r=peekRec(p,n);return !!r.work&&(careFor(p,n).length===0||!!r.care)}

 while(n>0){const b=Math.floor((n-1)/30);if(dayDone(p,n)){s++;n--;continue}if((used[b]||0)<PASSES&&s>0&&n>1&&dayDone(p,n-1)){used[b]=(used[b]||0)+1;n--;continue}break}
 const cb=Math.floor((Math.max(1,Math.min(dayNum(p),totalDays(p)))-1)/30);return{s,used:used[cb]||0}}
const streak=()=>streakInfo().s;
function totals(){let ses=0,care=0,perfect=false;for(const k in S.hist){const r=S.hist[k];if(r.work)ses++;if(r.care){ses++;care++}if(r.perfect)perfect=true}return{ses,care,perfect}}
function monthBest(){const p=S.plan;if(!p)return 0;const tot=Math.min(dayNum(p),totalDays(p));let best=0;for(let b=0;b*30<tot;b++){let c=0;for(let n=b*30+1;n<=Math.min(tot,b*30+30);n++)if(dayDone(p,n))c++;best=Math.max(best,c)}return best}

 app.innerHTML=({today:todayView,plans:plansView,month:monthView,body:bodyView,lib:libView,prog:progView,settings:settingsView,premium:premiumView,session:sessionView,quiz:quizView}[view]||todayView)();
 mountAnims();bind();if(view==="session")runTick()}
function bind(){
 app.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
 app.querySelectorAll("[data-pick]").forEach(b=>b.onclick=()=>{S.plan={id:b.dataset.pick,lvl:S.lvlPick||"regular",start:dayKey(new Date()),cycle:0};save();selDay=null;monthPage=null;go("today")});
 app.querySelectorAll("[data-lvl]").forEach(b=>b.onclick=()=>{S.lvlPick=b.dataset.lvl;save();render()});
 app.querySelectorAll("[data-k]").forEach(c=>c.onchange=()=>{const p=S.plan,n=view==="month"&&selDay?selDay:dayNum(p);const r=dayRec(p,n);if(c.checked)r[c.dataset.k]=true;else delete r[c.dataset.k];r.perfect=habitsFor(p,n).every(([k])=>r[k])||undefined;save();checkBadges();if(view!=="today"||c.dataset.k==="care"||c.dataset.k==="work")render()});
 app.querySelectorAll("[data-sess]").forEach(b=>b.onclick=()=>startSession(b.dataset.sess));
 app.querySelectorAll(".ex[data-ex]").forEach(li=>{const f=()=>openEx(li.dataset.ex,li.dataset.dose);li.onclick=f;li.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();f()}}});
 app.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{selDay=+b.dataset.day;render()});
 app.querySelectorAll("[data-mp]").forEach(b=>b.onclick=()=>{monthPage=+b.dataset.mp;selDay=monthPage*30+1;render()});
 app.querySelectorAll("[data-area]").forEach(b=>b.onclick=()=>go("body",b.dataset.area));
 app.querySelectorAll("[data-af]").forEach(b=>b.onclick=()=>{areaF=b.dataset.af;render()});
 app.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{S.lang=b.dataset.lang;save();render()});
 app.querySelectorAll("[data-dm]").forEach(b=>b.onclick=()=>{demoMode=b.dataset.dm;render()});
 const qi=document.getElementById("q");if(qi)qi.oninput=()=>{q=qi.value;const pos=qi.selectionStart;render();const n=document.getElementById("q");n.focus();n.setSelectionRange(pos,pos)};
 const $=id=>document.getElementById(id);
 if($("again"))$("again").onclick=()=>{S.plan.start=dayKey(new Date());S.plan.cycle=(S.plan.cycle||0)+planById(S.plan.id).months;save();render()};
 if($("licGo"))$("licGo").onclick=()=>activateKey($("licIn").value);
 if($("licOffAsk"))$("licOffAsk").onclick=()=>{lic.confirmOff=true;render()};
 if($("licOffNo"))$("licOffNo").onclick=()=>{lic.confirmOff=false;render()};
 if($("licOffYes"))$("licOffYes").onclick=()=>{lic.confirmOff=false;removeKey()};
 if($("exp"))$("exp").onclick=()=>{const b=new Blob([JSON.stringify(Object.assign({},S,{pro:S.pro?{plan:S.pro.plan}:undefined}),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="ikjon-fitness-"+dayKey(new Date())+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
 if($("wipe"))$("wipe").onclick=()=>{confirmWipe=true;render()};
 if($("wipeNo"))$("wipeNo").onclick=()=>{confirmWipe=false;render()};
 if($("wipeYes"))$("wipeYes").onclick=()=>{const lang=S.lang;if(S.pro&&S.pro.inst&&!S.pro.test)lsPost("deactivate",{license_key:S.pro.key,instance_id:S.pro.inst}).catch(()=>{});try{localStorage.removeItem(KEY)}catch(e){}S={lang,plan:null,hist:{}};save();confirmWipe=false;go("today");gate()};
 if($("sesNext"))$("sesNext").onclick=nextStep;
 app.querySelectorAll("[data-fb]").forEach(b=>b.onclick=()=>{const k=b.dataset.fb,p=S.plan;p.adj=Math.min(1.5,Math.max(.7,(p.adj||1)*(k==="easy"?1.08:k==="hard"?.9:1)));const r=dayRec(p,ses.n);r.fb=k;ses.fb=k;save();render()});
 app.querySelectorAll("[data-qk]").forEach(b=>b.onclick=()=>{quiz[b.dataset.qk]=b.dataset.qv;render();scrollTo(0,0)});
 if($("qReset"))$("qReset").onclick=()=>{quiz={};render()};
 if($("shareBtn"))$("shareBtn").onclick=shareCard;
 if($("remGo"))$("remGo").onclick=()=>reminderICS($("remT").value);
 if($("optVoice"))$("optVoice").onchange=e=>{S.voice=e.target.checked;save()};
 if($("optSound"))$("optSound").onchange=e=>{S.sound=e.target.checked;save()};
 if($("sesSkip"))$("sesSkip").onclick=()=>{ses.set=ses.list[ses.i].s;ses.mode="work";nextStep()};
 if($("sesPause"))$("sesPause").onclick=()=>{ses.running=!ses.running;render()};
 if($("sesQuit"))$("sesQuit").onclick=()=>{ses=null;lockOff();try{speechSynthesis.cancel()}catch(e){}go("today")};
 if($("sesHome"))$("sesHome").onclick=()=>{ses=null;go(selDay&&S.plan&&selDay!==dayNum(S.plan)?"month":"today")};
}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{if(b.dataset.v==="body")cur=null;if(b.dataset.v==="month")selDay=null;go(b.dataset.v,b.dataset.v==="body"?null:undefined)});
document.getElementById("homeBtn").onclick=()=>go("today");
document.getElementById("setBtn").onclick=()=>go("settings");
document.getElementById("exDlg").addEventListener("click",e=>{if(e.target.id==="exDlg")e.target.close()});
(function(){try{const u=new URL(location.href);let k=u.searchParams.get("key");const h=new URLSearchParams(location.hash.slice(1));if(!k)k=h.get("key");
 if(k){u.searchParams.delete("key");history.replaceState(null,"",u.pathname+(u.search||""));view="settings";render();activateKey(k)}}catch(e){}})();
try{speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
/* deep link from the website: /fitness/#plan=men|women|hair|face|daily → asks one question, then shows that plan */
(function(){const m=/^plan=(men|women|hair|face|daily)$/.exec(location.hash.slice(1));if(!m)return;const id=m[1];
 quiz=id==="men"?{who:"m",goal:"body"}:id==="women"?{who:"w",goal:"body"}:{who:"m",goal:id};view="quiz";history.replaceState(null,"",location.pathname+location.search)})();
const hv=location.hash.slice(1);if(["quiz","plans","month","body","lib","prog","premium","settings"].includes(hv))view=hv;
render();gate();recheckKey();

</script>
