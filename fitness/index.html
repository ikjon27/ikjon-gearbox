const EX={
ankle_pumps:["Ankle pumps","ankle","Circulation, ankle range",["Lie or sit with the leg straight.","Pull toes up towards you, then point them away.","Keep a steady rhythm."],"Moves swelling out after injury or surgery.","","Mobility","ankle_pumps"],
quad_set:["Quad sets","knee","Quadriceps activation",["Sit or lie with the leg straight and a rolled towel under the knee.","Tighten the thigh to press the back of the knee into the towel.","Hold, then relax fully."],"Watch the kneecap glide up as the muscle switches on.","Towel","Isometric","quad_set"],
slr:["Straight leg raise","knee","Quadriceps, hip flexors",["Lie on your back, other knee bent.","Lock the straight knee with a quad set first.","Lift the leg to the height of the other knee, lower slowly."],"If the knee bends during the lift (a 'lag'), go back to quad sets.","","Strength","slr"],

mini_squat:["Mini squat (0–45°)","knee","Quads, glutes",["Feet hip-width, hold a support if needed.","Sit back a little as if to a high chair, knees to about 45°.","Push through both heels to stand."],"Knees track over the 2nd toe, not caving in.","","Strength","mini_squat"],
wall_sit:["Wall sit","knee","Quadriceps isometric",["Back against a wall, slide down to a pain-free knee angle.","Keep weight in the heels.","Hold the position, breathe normally."],"Isometric holds often reduce knee and tendon pain for a while afterwards.","Wall","Isometric","wall_sit"],

squat:["Squat","knee","Quads, glutes",["Feet shoulder-width (hold a weight at the chest to progress).","Sit down between the heels to a pain-free depth.","Stand tall, squeezing glutes."],"3 s down, 3 s up builds strength in tendons too.","Optional weight","Strength","squat"],

nordic:["Nordic hamstring curl","thigh","Eccentric hamstrings",["Kneel with a partner holding your ankles.","Lower your body forward as slowly as possible, hips straight.","Catch yourself with your hands, push back up."],"One of the best-proven hamstring injury preventers in football.","Partner","Strength","nordic"],

strides:["Running strides","general","Speed, hamstring loading",["Run 60–80 m, building up gradually.","Reach the target speed in the middle third.","Walk back to recover."],"Progress 60% → 75% → 90% → 100% effort across sessions.","","Cardio","strides"],

const G=176,TL=48,THL=38,SHL=36,UAL=27,FAL=27,FTL=12,RAD=Math.PI/180;
function ik(a,b,l1,l2,s){const dx=b[0]-a[0],dy=b[1]-a[1];let dd=Math.hypot(dx,dy);const dc=Math.min(Math.max(dd,Math.abs(l1-l2)+.5),l1+l2-.3);
 const an=Math.atan2(dy,dx),al=Math.acos(Math.min(1,Math.max(-1,(l1*l1+dc*dc-l2*l2)/(2*l1*dc))))*s;
 const j=[a[0]+l1*Math.cos(an+al),a[1]+l1*Math.sin(an+al)];const ex2=b[0]-j[0],ey=b[1]-j[1],m=Math.hypot(ex2,ey)||1;
 return [j,[j[0]+l2*ex2/m,j[1]+l2*ey/m]]}
function solve(p){
 const h=p.h,tr=p.t*RAD,dir=[Math.sin(tr),-Math.cos(tr)];
 const sh=[h[0]+44*dir[0],h[1]+44*dir[1]],nk=[h[0]+TL*dir[0],h[1]+TL*dir[1]];
 const hr=(p.t+(p.n||0))*RAD,hd=[nk[0]+11*Math.sin(hr),nk[1]-11*Math.cos(hr)];
 const leg=(f,k,s)=>k?[k,f]:ik(h,f,THL,SHL,s);
 const arm=(w,e,s)=>e?[e,w]:ik(sh,w,UAL,FAL,s);
 const [k1,a1]=leg(p.f1,p.k1,p.ks1??-1),[k2,a2]=leg(p.f2,p.k2,p.ks2??-1);
 const [e1,w1]=arm(p.w1,p.e1,p.es1??1),[e2,w2]=arm(p.w2,p.e2,p.es2??1);
 const toe=(a,dg)=>[a[0]+FTL*Math.cos(dg*RAD),a[1]+FTL*Math.sin(dg*RAD)];
 const J={h,sh,nk,hd,k1,a1,k2,a2,e1,w1,e2,w2,tp1:toe(a1,p.toe1||0),tp2:toe(a2,p.toe2||0),dir,mid:[(h[0]+sh[0])/2,(h[1]+sh[1])/2]};
 if(p.hd1!=null)J.hp1=[w1[0]+10*Math.cos(p.hd1*RAD),w1[1]+10*Math.sin(p.hd1*RAD)];
 return J}
const F1=n=>Math.round(n*10)/10;
function seg(a,b,cls,w,hl,key){return `<line x1="${F1(a[0])}" y1="${F1(a[1])}" x2="${F1(b[0])}" y2="${F1(b[1])}" class="${cls}${hl&&hl.includes(key)?" hl":""}" stroke-width="${w}" stroke-linecap="round"/>`}
function pt(J,v){return typeof v==="string"?J[v]:v}
function propSVG(pr,J,front){let s="";for(const q of pr){const k=q.k,fr=(k==="band"||k==="ball"||k==="weight"||k==="towel");if(fr!==front)continue;
 if(k==="wall")s+=`<rect class="prop" x="${q.x}" y="0" width="8" height="${G}"/>`;
 else if(k==="step"||k==="box")s+=`<rect class="prop" x="${q.x}" y="${q.y}" width="${q.w}" height="${G-q.y}" rx="2"/>`;
 else if(k==="bench"||k==="bed")s+=`<rect class="prop" x="${q.x}" y="${q.y}" width="${q.w}" height="7" rx="2"/><rect class="prop" x="${q.x+4}" y="${q.y}" width="5" height="${G-q.y}"/><rect class="prop" x="${q.x+q.w-9}" y="${q.y}" width="5" height="${G-q.y}"/>`;
 else if(k==="chair")s+=`<rect class="prop" x="${q.x}" y="${q.y}" width="36" height="6" rx="2"/><rect class="prop" x="${q.x}" y="${q.y-44}" width="5" height="${G-q.y+44}"/><rect class="prop" x="${q.x+31}" y="${q.y}" width="5" height="${G-q.y}"/>`;
 else if(k==="table")s+=`<rect class="prop" x="${q.x}" y="${q.y}" width="${q.w}" height="6" rx="2"/><rect class="prop" x="${q.x+q.w-10}" y="${q.y}" width="5" height="${G-q.y}"/>`;
 else if(k==="post")s+=`<rect class="prop" x="${q.x}" y="${q.y||60}" width="7" height="${G-(q.y||60)}"/>`;
 else if(k==="wedge")s+=`<polygon class="prop" points="${q.x},${G} ${q.x+q.w},${G} ${q.x+q.w},${G-q.h}"/>`;
 else if(k==="bike")s+=`<rect class="prop" x="94" y="112" width="24" height="5" rx="2"/><line class="propl" x1="106" y1="117" x2="132" y2="150" stroke-width="5"/><line class="propl" x1="132" y1="150" x2="158" y2="96" stroke-width="5"/><line class="propl" x1="150" y1="92" x2="166" y2="92" stroke-width="5"/><line class="propl" x1="132" y1="150" x2="132" y2="${G}" stroke-width="5"/><line class="propl" x1="100" y1="${G}" x2="166" y2="${G}" stroke-width="6"/><circle class="propl" cx="132" cy="150" r="14" stroke-width="2"/>`;
 else if(k==="cones")s+=[60,120,180].map(x=>`<polygon class="prop" style="fill:var(--orange);opacity:.55" points="${x-7},${G} ${x+7},${G} ${x},${G-16}"/>`).join("");
 else if(k==="band"){const a=pt(J,q.a),b=pt(J,q.b);s+=`<line class="band" x1="${F1(a[0])}" y1="${F1(a[1])}" x2="${F1(b[0])}" y2="${F1(b[1])}" stroke-width="2.5"/>`}
 else if(k==="ball"){const a=pt(J,q.at);s+=`<circle cx="${F1(a[0]+(q.dx||0))}" cy="${F1(a[1]+(q.dy||0))}" r="${q.r||7}" style="fill:var(--orange)"/>`}
 else if(k==="weight"){const a=pt(J,q.at);s+=`<rect x="${F1(a[0]-6+(q.dx||0))}" y="${F1(a[1]-4+(q.dy||0))}" width="12" height="11" rx="3" style="fill:var(--navy);opacity:.8"/>`}
 else if(k==="towel"){const a=pt(J,q.at);s+=`<ellipse cx="${F1(a[0]+(q.dx||0))}" cy="${F1(a[1]+(q.dy||0))}" rx="8" ry="4" style="fill:var(--orange);opacity:.7"/>`}
 }return s}
function figSVG(p,pr){const J=solve(p),hl=p.hl||[];
 let s=`<line class="gnd" x1="0" y1="${G+1}" x2="240" y2="${G+1}" stroke-width="2"/>`+propSVG(pr,J,false);
 s+=seg(J.sh,J.e2,"far",6,hl,"ua2")+seg(J.e2,J.w2,"far",5.5,hl,"fa2")+seg(J.h,J.k2,"far",8,hl,"th2")+seg(J.k2,J.a2,"far",7,hl,"sh2")+seg(J.a2,J.tp2,"far",5,hl,"ft2");
 if(p.c){const m=J.mid,px=-J.dir[1],py=J.dir[0];s+=`<path d="M${F1(J.h[0])} ${F1(J.h[1])} Q${F1(m[0]+px*p.c*2)} ${F1(m[1]+py*p.c*2)} ${F1(J.nk[0])} ${F1(J.nk[1])}" class="tor${hl.includes("tor")?" hl":""}" stroke-width="10" fill="none" stroke-linecap="round"/>`}
 else s+=seg(J.h,J.nk,"tor",10,hl,"tor");
 s+=`<circle class="head" cx="${F1(J.hd[0])}" cy="${F1(J.hd[1])}" r="10"/>`;
 if(hl.includes("hip"))s+=`<circle class="hlc" cx="${F1(J.h[0])}" cy="${F1(J.h[1])}" r="7"/>`;
 s+=seg(J.h,J.k1,"near",8.5,hl,"th1")+seg(J.k1,J.a1,"near",7.5,hl,"sh1")+seg(J.a1,J.tp1,"near",5.5,hl,"ft1");
 s+=seg(J.sh,J.e1,"near",6.5,hl,"ua1")+seg(J.e1,J.w1,"near",6,hl,"fa1");
 if(J.hp1)s+=seg(J.w1,J.hp1,"near",5,hl,"hd1");
 s+=propSVG(pr,J,true);
 return s}

function lerp(a,b,e){const o={};for(const k in a){const va=a[k],vb=b[k];if(typeof va==="number"&&typeof vb==="number")o[k]=va+(vb-va)*e;else if(Array.isArray(va)&&Array.isArray(vb)&&typeof va[0]==="number")o[k]=[va[0]+(vb[0]-va[0])*e,va[1]+(vb[1]-va[1])*e];else o[k]=e<.5?va:(vb===undefined?va:vb)}
 for(const k in b)if(!(k in o))o[k]=b[k];return o}

 if(tp.fn){const ph=(ms%tp.per)/tp.per;return P(tp.b,tp.fn(ph))}
 const fr=tp.fr,tot=fr.reduce((a,f)=>a+f[1],0);let t=ms%tot,i=0;while(t>fr[i][1]){t-=fr[i][1];i++}
 const u=t/fr[i][1],e=(1-Math.cos(Math.PI*u))/2;return lerp(fr[i][0],fr[(i+1)%fr.length][0],e)}

const I18N={"uz":{"Hair & scalp":"Soch va bosh terisi","Face & jaw":"Yuz va jag‘","Eyes":"Ko‘zlar","Teeth & mouth":"Tish va og‘iz","Neck & posture":"Bo‘yin va qomat","Shoulders, arms & chest":"Yelka, qo‘l va ko‘krak","Back":"Bel va orqa","Core & waist":"Qorin va bel","Hips & glutes":"Son va dumba","Legs":"Oyoqlar","Feet & toes":"Oyoq panjasi va barmoqlar","Hands & nails":"Qo‘l panjasi va tirnoqlar","Skin":"Teri","Heart & lungs":"Yurak va o‘pka","Pelvic floor":"Chanoq tubi mushaklari","Sleep & mind":"Uyqu va ruhiyat","Exercise cannot reverse genetic (pattern) hair loss. What it can do is support healthy hair: lower stress, better sleep and good blood flow.":"Mashq irsiy (androgen) soch to‘kilishini to‘xtata olmaydi. Lekin u sog‘lom sochni qo‘llab-quvvatlaydi: stressni kamaytiradi, uyquni yaxshilaydi va qon aylanishini oshiradi.","Daily scalp massage: in small studies, about 4 minutes a day for 6 months made hair a little thicker. It is free and safe — be consistent.":"Har kuni bosh terisini uqalash: kichik tadqiqotlarda kuniga taxminan 4 daqiqa, 6 oy davomida sochni biroz qalinlashtirgan. Bu bepul va xavfsiz — muntazam bo‘ling.","Eat enough protein, iron and zinc (meat, eggs, beans, lentils, greens). Crash diets often cause hair shedding 2–3 months later.":"Yetarli oqsil, temir va rux iste’mol qiling (go‘sht, tuxum, loviya, yasmiq, ko‘katlar). Keskin parhezlar ko‘pincha 2–3 oydan keyin soch to‘kilishiga sabab bo‘ladi.","Be gentle: avoid tight ponytails, braids and buns, very hot dryers and harsh chemicals.":"Ehtiyot bo‘ling: tor bog‘langan dum, o‘rim va tugunlardan, juda issiq fen va kuchli kimyoviy vositalardan saqlaning.","Proven treatments for pattern hair loss (such as minoxidil, and finasteride for men) need advice from a doctor or pharmacist. See a doctor if hair falls out suddenly, in patches, or with an itchy, scaly scalp.":"Androgen soch to‘kilishining isbotlangan davolash usullari (masalan, minoksidil, erkaklarda finasterid) shifokor yoki farmatsevt maslahatini talab qiladi. Soch to‘satdan, o‘choq-o‘choq bo‘lib to‘kilsa yoki bosh terisi qichishib, po‘st tashlasa, shifokorga boring.","Face exercises are a small, low-risk habit. One small study found daily facial exercises for 20 weeks made cheeks look slightly fuller. The biggest factors for skin are sun protection, sleep and not smoking.":"Yuz mashqlari — kichik va xavfsiz odat. Bir kichik tadqiqotda 20 hafta davomida har kungi yuz mashqlari yonoqlarni biroz to‘liqroq ko‘rsatgan. Teri uchun eng muhimi — quyoshdan himoya, uyqu va chekmaslik.","Relax the jaw during the day: teeth apart, lips together, tongue resting on the roof of the mouth. Clenching can cause jaw pain and headaches.":"Kun davomida jag‘ni bo‘shashtiring: tishlar ochiq, lablar yopiq, til tanglayga tegib turadi. Tishlarni qisish jag‘ og‘rig‘i va bosh og‘rig‘iga sabab bo‘lishi mumkin.","Use the 20-20-20 rule: every 20 minutes of screen time, look at something about 6 metres (20 feet) away for 20 seconds.":"20-20-20 qoidasi: ekranga qaragan har 20 daqiqada 20 soniya davomida taxminan 6 metr uzoqlikdagi narsaga qarang.","Eye exercises ease tiredness but do not fix short-sightedness. Spending time outdoors in daylight helps protect children's eyesight. Get your eyes checked every 1–2 years.":"Ko‘z mashqlari charchoqni kamaytiradi, lekin yaqinni ko‘rishni tuzatmaydi. Kunduzi ochiq havoda vaqt o‘tkazish bolalar ko‘rishini himoya qiladi. Har 1–2 yilda ko‘zingizni tekshirtiring.","Brush twice a day for 2 minutes with fluoride toothpaste, and clean between your teeth once a day. A healthy smile is one of the most attractive things you can have.":"Kuniga ikki marta 2 daqiqadan ftorli tish pastasi bilan tish yuving va kuniga bir marta tishlar orasini tozalang. Sog‘lom tabassum — eng jozibali narsalardan biri.","Limit sugary drinks and snacks between meals. See a dentist every 6–12 months.":"Ovqatlar orasida shirin ichimlik va gazaklarni kamaytiring. Har 6–12 oyda stomatologga boring.","Good posture is mostly strength and habit: strong upper-back muscles, chin gently tucked, screen at eye level. Change position every 30–45 minutes.":"Yaxshi qomat — asosan kuch va odat: kuchli yuqori orqa mushaklari, iyak biroz ichkariga, ekran ko‘z darajasida. Har 30–45 daqiqada holatingizni o‘zgartiring.","Push-ups, rows and presses build strong shoulders and arms. Train them 2–3 times a week and add reps or sets slowly.":"Otjimaniya, tortish va itarish mashqlari yelka va qo‘llarni kuchaytiradi. Ularni haftasiga 2–3 marta bajaring va takrorlarni asta-sekin oshiring.","A strong back protects you from pain and makes you stand taller. Balance every pushing exercise with a pulling exercise (rows, Y-raises).":"Kuchli orqa sizni og‘riqdan himoya qiladi va qaddingizni tik tutadi. Har bir itarish mashqini tortish mashqi bilan muvozanatlang (tortish, Y-ko‘tarish).","You cannot burn fat from one spot. A slimmer waist comes from overall activity, good food and sleep; core exercises make the muscles underneath strong and support your back.":"Bitta joydan yog‘ yoqib bo‘lmaydi. Ingichka bel umumiy faollik, to‘g‘ri ovqatlanish va uyqudan keladi; qorin mashqlari ostidagi mushaklarni kuchaytiradi va belni qo‘llab-quvvatlaydi.","Strong glutes improve your shape, posture and running, and protect the knees and back. Bridges, squats and side-lying work are the base.":"Kuchli dumba mushaklari qomat, gavda tuzilishi va yugurishni yaxshilaydi, tizza va belni himoya qiladi. Ko‘prik, o‘tirib-turish va yonboshlab bajariladigan mashqlar — asos.","Leg muscles are the biggest in the body — training them raises your energy use and keeps you strong as you age.":"Oyoq mushaklari tanadagi eng katta mushaklar — ularni mashq qilish energiya sarfini oshiradi va yoshingiz o‘tganda ham sizni baquvvat saqlaydi.","Strong feet and toes improve balance and help prevent heel and arch pain. Train them barefoot for a few minutes a day.":"Kuchli oyoq panjasi va barmoqlar muvozanatni yaxshilaydi, tovon va oyoq gumbazi og‘rig‘ining oldini oladi. Har kuni bir necha daqiqa yalangoyoq mashq qiling.","Foot care: wash and dry well between the toes, moisturise dry heels, wear shoes that fit, and change socks daily.":"Oyoq parvarishi: barmoqlar orasini yaxshilab yuvib quriting, quruq tovonlarga krem surting, mos poyabzal kiying va paypoqni har kuni almashtiring.","Toenails: cut straight across, not too short, and do not dig into the corners — this prevents ingrown nails. See a doctor for thick, yellow or painful nails.":"Oyoq tirnoqlari: to‘g‘ri chiziq bo‘ylab, juda kalta emas qilib kesing va burchaklarini kovlamang — bu tirnoq go‘shtga o‘sib kirishining oldini oladi. Qalin, sarg‘aygan yoki og‘riqli tirnoqlar bo‘lsa, shifokorga boring.","Grip strength is linked with good long-term health. Squeeze, spread and stretch your fingers every day.":"Qo‘l siqish kuchi uzoq muddatli sog‘liq bilan bog‘liq. Har kuni barmoqlaringizni siqing, yoying va cho‘zing.","Nails: keep them short and clean, moisturise the cuticles instead of cutting them, and avoid biting. Nails reflect nutrition — eat enough protein and iron.":"Tirnoqlar: ularni kalta va toza saqlang, kutikulani kesmasdan namlantiring, tirnoq tishlamang. Tirnoqlar ovqatlanishni aks ettiradi — yetarli oqsil va temir iste’mol qiling.","Sunscreen (SPF 30+) on the face and neck every day is the most proven way to keep skin looking young. Add water, sleep and vegetables.":"Har kuni yuz va bo‘yinga quyoshdan himoya kremi (SPF 30+) surtish — terini yosh ko‘rsatishning eng isbotlangan usuli. Bunga suv, uyqu va sabzavotlarni qo‘shing.","Exercise improves blood flow to the skin. Wash your face after sweating. See a doctor about a mole that changes shape, colour or size.":"Mashq teriga qon oqimini yaxshilaydi. Terlagandan keyin yuzingizni yuving. Shakli, rangi yoki hajmi o‘zgargan xol bo‘lsa, shifokorga ko‘rining.","Adults need at least 150 minutes a week of brisk activity (like fast walking) or 75 minutes of hard activity, plus muscle training on 2 days.":"Kattalarga haftasiga kamida 150 daqiqa tez faollik (masalan, tez yurish) yoki 75 daqiqa jadal faollik va 2 kun mushak mashqlari kerak.","Slow belly breathing calms the body and can lower stress. Stop and get help if you have chest pain, fainting or unusual breathlessness.":"Sekin qorin bilan nafas olish tanani tinchlantiradi va stressni kamaytiradi. Ko‘krakda og‘riq, hushdan ketish yoki g‘ayrioddiy hansirash bo‘lsa, to‘xtang va yordam so‘rang.","Pelvic floor training is proven for both women and men: it helps bladder control, supports the core and can improve sexual health.":"Chanoq tubi mashqlari ayollar va erkaklar uchun isbotlangan: siydik pufagi nazoratiga yordam beradi, qorin mushaklarini qo‘llab-quvvatlaydi va jinsiy salomatlikni yaxshilashi mumkin.","During pregnancy or after giving birth, ask your doctor or midwife which exercises are right for you.":"Homiladorlik paytida yoki tug‘ruqdan keyin qaysi mashqlar sizga mosligini shifokor yoki doyadan so‘rang.","Most adults need 7–9 hours of sleep. Sleep is when muscles repair, skin renews and hormones balance — it is part of your training.":"Ko‘pchilik kattalarga 7–9 soat uyqu kerak. Uyquda mushaklar tiklanadi, teri yangilanadi va gormonlar muvozanatlashadi — bu mashg‘ulotingizning bir qismi.","Same bedtime every day, a dark cool room, and screens off 30 minutes before bed. If you feel low for weeks, talk to someone you trust or a doctor.":"Har kuni bir xil vaqtda yoting, xona qorong‘i va salqin bo‘lsin, uxlashdan 30 daqiqa oldin ekranlarni o‘chiring. Agar haftalab kayfiyatingiz tushkun bo‘lsa, ishonchli odam yoki shifokor bilan gaplashing.","Scalp massage":"Bosh terisini uqalash","Scalp blood flow, relaxation":"Bosh terisida qon aylanishi, bo‘shashish","Place your fingertips (not nails) on the scalp.":"Barmoq uchlarini (tirnoqni emas) bosh terisiga qo‘ying.","Press firmly and move the skin in small circles — do not just rub the hair.":"Qattiqroq bosib, terini kichik doiralar bo‘ylab harakatlantiring — faqat sochni ishqalamang.","Work from the front hairline to the crown, the sides and the back of the head.":"Peshonadagi soch chizig‘idan tepaga, yon tomonlarga va bosh orqasiga qarab harakatlaning.","Keep going for the full time, breathing slowly.":"Sekin nafas olib, butun vaqt davomida davom eting.","Do it every day — results in studies took about 6 months.":"Har kuni bajaring — tadqiqotlarda natija taxminan 6 oyda ko‘ringan.","Neck & upper-shoulder release":"Bo‘yin va yelka ustini bo‘shashtirish","Tension around the head and neck":"Bosh va bo‘yin atrofidagi zo‘riqish","Sit tall and drop your shoulders.":"Tik o‘tiring va yelkalaringizni pastga tushiring.","Tilt your ear towards one shoulder and hold.":"Qulog‘ingizni bir yelkaga qarab egib, ushlab turing.","Gently press the tight muscle at the top of the shoulder with the other hand. Switch sides.":"Ikkinchi qo‘l bilan yelka ustidagi tarang mushakni yengil bosing. Tomonni almashtiring.","Gentle stretch only — no pain.":"Faqat yengil cho‘zilish — og‘riqsiz.","Cheek lifter":"Yonoqni ko‘tarish","Cheek and smile muscles":"Yonoq va tabassum mushaklari","Open your mouth into a long \"O\", lips covering the teeth.":"Og‘zingizni cho‘zinchoq «O» shaklida oching, lablar tishlarni yopsin.","Smile with the upper cheeks to lift them up.":"Yonoqlarni yuqoriga ko‘tarish uchun yuqori yonoqlar bilan jilmaying.","Place your fingers lightly on the cheeks and hold, then relax.":"Barmoqlaringizni yonoqlarga yengil qo‘yib ushlab turing, so‘ng bo‘shashing.","Keep the forehead relaxed.":"Peshonani bo‘shashtirilgan holda tuting.","Jaw relax & open":"Jag‘ni bo‘shashtirish va ochish","Jaw muscles, clenching":"Jag‘ mushaklari, tish qisish","Rest the tip of your tongue behind the top teeth.":"Til uchini yuqori tishlar orqasiga qo‘ying.","Slowly open your mouth as far as is comfortable, keeping the tongue there.":"Tilni o‘sha joyda saqlab, og‘zingizni qulay darajada sekin oching.","Close slowly. Then massage the jaw muscle in front of the ear in circles.":"Sekin yoping. So‘ng quloq oldidagi jag‘ mushagini aylana bo‘ylab uqalang.","Stop if the jaw clicks painfully.":"Jag‘ og‘riq bilan qirsillasa, to‘xtating.","Forehead smoother":"Peshonani tekislash","Forehead and frown lines":"Peshona va qosh orasidagi chiziqlar","Place your fingertips flat on the forehead.":"Barmoq uchlarini peshonaga tekis qo‘ying.","Gently glide them out towards the temples, smoothing the skin.":"Terini tekislab, ularni chakkalarga qarab sekin suring.","Relax the eyebrows completely between strokes.":"Har harakatdan keyin qoshlarni butunlay bo‘shashtiring.","Use a little moisturiser so the fingers glide.":"Barmoqlar sirpanishi uchun ozgina krem surting.","Chin & neck lift":"Iyak va bo‘yinni ko‘tarish","Front of the neck, jawline":"Bo‘yin oldi, jag‘ chizig‘i","Sit tall and look up towards the ceiling.":"Tik o‘tirib, shiftga qarang.","Push your lower lip over the upper lip (or press the tongue to the roof of the mouth).":"Pastki labni yuqori lab ustiga chiqaring (yoki tilni tanglayga bosing).","Feel the front of the neck work. Hold, then return slowly.":"Bo‘yin oldi ishlayotganini his qiling. Ushlab turing, so‘ng sekin qayting.","Skip it if looking up makes you dizzy.":"Yuqoriga qarash bosh aylanishiga sabab bo‘lsa, bajarmang.","Smile hold":"Tabassumni ushlab turish","Mouth corners, cheeks":"Og‘iz burchaklari, yonoqlar","Smile widely with the lips closed.":"Lablarni yopiq holda keng jilmaying.","Pull the corners of the mouth up and back. Hold.":"Og‘iz burchaklarini yuqoriga va orqaga torting. Ushlab turing.","Relax fully, then repeat.":"To‘liq bo‘shashing, so‘ng takrorlang.","A real smile also makes you look more approachable.":"Samimiy tabassum sizni yanada ochiqroq ko‘rsatadi.","Near–far focus":"Yaqin-uzoqqa qarash","Eye focusing muscles, screen tiredness":"Ko‘z fokus mushaklari, ekrandan charchash","Hold your thumb about 25 cm in front of your face.":"Bosh barmog‘ingizni yuzingizdan taxminan 25 sm oldinda tuting.","Focus on it for a few seconds.":"Bir necha soniya unga qarang.","Then focus on something far away (6 m or more). Switch back and forth.":"So‘ng uzoqdagi narsaga (6 m va undan uzoq) qarang. Navbatma-navbat almashtiring.","Blink normally — screens make us blink less.":"Odatdagidek ko‘z qisib turing — ekran ko‘z qisishni kamaytiradi.","Eye movements":"Ko‘z harakatlari","Eye muscles":"Ko‘z mushaklari","Keep your head still.":"Boshingizni qimirlatmang.","Look up, down, left and right slowly, pausing at each end.":"Sekin yuqoriga, pastga, chapga va o‘ngga qarang, har birida to‘xtab.","Then draw slow circles with your eyes, both directions.":"So‘ng ko‘zlaringiz bilan ikki tomonga sekin doira chizing.","Gentle — stop if it causes dizziness.":"Yengil bajaring — bosh aylansa, to‘xtang.","Palming":"Kaftlar bilan ko‘zni yopish","Eye rest, relaxation":"Ko‘z dam olishi, bo‘shashish","Rub your palms together to warm them.":"Kaftlaringizni isitish uchun bir-biriga ishqalang.","Cup them over your closed eyes without pressing.":"Ularni bosmasdan yopiq ko‘zlaringiz ustiga qo‘ying.","Breathe slowly and enjoy the darkness.":"Sekin nafas oling va qorong‘ilikdan bahra oling.","Great after long screen time.":"Uzoq ekran oldida o‘tirgandan keyin juda foydali.","2-minute brush & floss":"2 daqiqa tish yuvish va ip bilan tozalash","Teeth and gums":"Tish va milklar","Brush all surfaces of the teeth for 2 minutes with fluoride toothpaste.":"Ftorli tish pastasi bilan tishlarning barcha yuzalarini 2 daqiqa yuving.","Brush gently along the gum line in small circles.":"Milk chizig‘i bo‘ylab kichik doiralar bilan yengil yuving.","Clean between the teeth with floss or small brushes. Spit, don't rinse.":"Tishlar orasini ip yoki kichik cho‘tka bilan tozalang. Tupuring, chaymang.","Brush your tongue too for fresh breath.":"Toza nafas uchun tilingizni ham tozalang.","Belly breathing":"Qorin bilan nafas olish","Diaphragm, stress":"Diafragma, stress","Sit or lie comfortably, one hand on the chest, one on the belly.":"Qulay o‘tiring yoki yoting, bir qo‘l ko‘krakda, biri qorinda.","Breathe in through the nose for 4 seconds — only the belly hand rises.":"Burun orqali 4 soniya nafas oling — faqat qorindagi qo‘l ko‘tariladi.","Breathe out slowly through the mouth for 6 seconds.":"Og‘iz orqali 6 soniya sekin nafas chiqaring.","A longer out-breath calms the body.":"Uzunroq nafas chiqarish tanani tinchlantiradi.","Box breathing":"To‘rtburchak nafas","Calm, focus":"Xotirjamlik, diqqat","Breathe in through the nose for 4 seconds.":"Burun orqali 4 soniya nafas oling.","Hold for 4 seconds.":"4 soniya ushlab turing.","Breathe out for 4 seconds, then hold for 4 seconds. Repeat.":"4 soniya nafas chiqaring, so‘ng 4 soniya ushlab turing. Takrorlang.","Use it before an exam, an interview or sleep.":"Imtihon, suhbat yoki uyqudan oldin foydalaning.","Pelvic floor squeeze (Kegel)":"Chanoq tubini siqish (Kegel)","Pelvic floor muscles":"Chanoq tubi mushaklari","Sit or lie comfortably. Find the muscles you would use to stop passing urine and wind.":"Qulay o‘tiring yoki yoting. Siydik va gaz chiqishini to‘xtatish uchun ishlatiladigan mushaklarni toping.","Squeeze and lift them inwards. Hold for the count, breathing normally.":"Ularni siqib, ichkariga va yuqoriga torting. Odatdagidek nafas olib, sanoq davomida ushlab turing.","Relax fully for the same time. Then do 10 quick squeezes.":"Xuddi shuncha vaqt to‘liq bo‘shashing. So‘ng 10 ta tez siqish bajaring.","Don't squeeze the buttocks or hold your breath. Don't practise while actually urinating.":"Dumbani siqmang va nafasni ushlamang. Haqiqatan siyayotganda mashq qilmang.","Finger spread & squeeze":"Barmoqlarni yoyish va siqish","Hand muscles, grip":"Qo‘l panjasi mushaklari, qo‘l siqish","Make a tight fist and hold for 2 seconds.":"Mushtni qattiq tugib, 2 soniya ushlab turing.","Open and spread the fingers as wide as you can.":"Barmoqlarni ochib, iloji boricha keng yoying.","Touch each fingertip to the thumb in turn.":"Har bir barmoq uchini navbatma-navbat bosh barmoqqa tekkizing.","Squeeze a soft ball or rolled towel to make it harder.":"Qiyinlashtirish uchun yumshoq to‘p yoki o‘ralgan sochiqni siqing.","Wrist circles & stretch":"Bilakni aylantirish va cho‘zish","Wrists, forearms":"Bilaklar, tirsakdan pastki qism","Make slow circles with both wrists, 10 each way.":"Ikkala bilak bilan har tomonga 10 tadan sekin doira chizing.","Hold one arm straight, palm up, and gently pull the fingers back.":"Bir qo‘lni kaft yuqoriga qaratib to‘g‘ri tuting va barmoqlarni yengil orqaga torting.","Then palm down and pull the hand down. Switch arms.":"So‘ng kaftni pastga qaratib, panjani pastga torting. Qo‘lni almashtiring.","Good for phone and computer users.":"Telefon va kompyuter foydalanuvchilari uchun foydali.","Toe spread & lift":"Oyoq barmoqlarini yoyish va ko‘tarish","Toes, foot arch":"Oyoq barmoqlari, oyoq gumbazi","Sit with bare feet flat on the floor.":"Yalangoyoq, oyoqlarni polga tekis qo‘yib o‘tiring.","Spread all your toes as wide as possible and hold.":"Barcha barmoqlarni iloji boricha keng yoyib, ushlab turing.","Relax, then lift all toes up while the ball of the foot stays down.":"Bo‘shashing, so‘ng oyoq kafti polda qolgan holda barcha barmoqlarni ko‘taring.","Use your hands to help at first.":"Avvaliga qo‘llaringiz bilan yordam bering.","Knee push-up":"Tizzada otjimaniya","Chest, arms, core":"Ko‘krak, qo‘llar, qorin","Kneel with hands under the shoulders.":"Qo‘llarni yelka ostiga qo‘yib, tizzalab turing.","Keep a straight line from knees to head.":"Tizzadan boshgacha to‘g‘ri chiziqni saqlang.","Lower the chest towards the floor, then push back up.":"Ko‘krakni polga tushiring, so‘ng yuqoriga itaring.","When 3 × 12 is easy, try full push-ups.":"3 × 12 oson bo‘lganda, to‘liq otjimaniyaga o‘ting.","Pike push-up":"Pike otjimaniya","Shoulders, triceps":"Yelkalar, triseps","Start in a push-up position and walk your feet in so the hips go up into an upside-down V.":"Otjimaniya holatidan boshlang va oyoqlarni yaqinlashtirib, sonni teskari V shaklida ko‘taring.","Bend the elbows and lower the top of the head towards the floor.":"Tirsaklarni bukib, boshning tepasini polga tushiring.","Push back up.":"Yuqoriga qayta itaring.","Shorter range is fine at first.":"Avvaliga kichikroq amplituda yetarli.","Chair dip":"Stulda dip","Triceps, shoulders":"Triseps, yelkalar","Sit on the edge of a stable chair, hands next to your hips.":"Mustahkam stul chetiga o‘tiring, qo‘llar soningiz yonida.","Slide your bottom off the chair, knees bent.":"Tizzalarni bukib, dumbangizni stuldan siljiting.","Bend the elbows to lower yourself a little, then push back up.":"Tirsaklarni bukib biroz pastga tushing, so‘ng yuqoriga itaring.","Keep the shoulders down; stop if the front of the shoulder hurts.":"Yelkalarni pastda tuting; yelka oldi og‘risa, to‘xtang.","Sumo squat":"Sumo o‘tirib-turish","Glutes, inner thighs":"Dumba, sonning ichki qismi","Stand with feet wide, toes turned out.":"Oyoqlarni keng qo‘yib, barmoqlarni tashqariga buring.","Sit down between your heels with the chest up.":"Ko‘krakni tik tutib, tovonlaringiz orasiga o‘tiring.","Push through the heels to stand and squeeze the glutes.":"Tovonlarga tayanib turing va dumbani siqing.","Knees follow the line of the toes.":"Tizzalar oyoq barmoqlari yo‘nalishida.","Fire hydrant":"Yon tomonga oyoq ko‘tarish (to‘rt oyoqda)","Side glutes":"Dumbaning yon qismi","On hands and knees, back flat.":"Qo‘l va tizzalarda turing, orqa tekis.","Lift one bent knee out to the side to hip height.":"Bir bukilgan tizzani yon tomonga son balandligigacha ko‘taring.","Lower slowly. Finish all reps, then switch sides.":"Sekin tushiring. Barcha takrorlarni bajarib, tomonni almashtiring.","Don't lean away — keep the hips level.":"Qiyshaymang — sonni tekis tuting.","High knees":"Tizzani baland ko‘tarib yugurish","Heart rate, legs":"Yurak urishi, oyoqlar","Run on the spot, lifting the knees to hip height.":"Tizzalarni son balandligigacha ko‘tarib, joyida yuguring.","Land softly on the balls of the feet.":"Oyoq kaftiga yumshoq tushing.","Pump the arms.":"Qo‘llarni faol harakatlantiring.","Low-impact version: march fast instead.":"Yengil variant: o‘rniga tez qadam tashlang.","Burpee":"Berpi","Whole body, heart rate":"Butun tana, yurak urishi","Squat down and put your hands on the floor.":"O‘tirib, qo‘llarni polga qo‘ying.","Step or jump the feet back to a plank, then bring them back in.":"Oyoqlarni orqaga planka holatiga uzating yoki sakrab o‘ting, so‘ng qaytaring.","Stand up and reach the arms overhead (add a small jump if you can).":"Turing va qo‘llarni yuqoriga cho‘zing (iloji bo‘lsa, kichik sakrash qo‘shing).","Step back instead of jumping to make it easier.":"Osonroq qilish uchun sakramasdan qadam tashlang.","Lying leg raise":"Yotib oyoq ko‘tarish","Lower abs":"Qorinning pastki qismi","Lie on your back, hands under your lower back or by your sides.":"Chalqancha yoting, qo‘llar belingiz ostida yoki yon tomonda.","Keep the low back pressed down and lift both legs up.":"Belni polga bosib turib, ikkala oyoqni ko‘taring.","Lower them slowly without the back arching.":"Belni egmasdan ularni sekin tushiring.","Bend the knees to make it easier.":"Osonroq qilish uchun tizzalarni buking.","Progress check":"Natijani tekshirish","Motivation":"Motivatsiya","Take a photo in the same place and light each week (front and side).":"Har hafta bir xil joy va yorug‘likda surat oling (old va yon tomondan).","Optional: measure your waist at the belly button.":"Ixtiyoriy: belingizni kindik darajasida o‘lchang.","Compare month to month, not day to day.":"Kunma-kun emas, oyma-oy solishtiring.","Photos stay in your own phone gallery — the app never sees them.":"Suratlar faqat telefoningiz galereyasida qoladi — ilova ularni ko‘rmaydi.","Push-up":"Otjimaniya","Too hard? Start with wall push-ups.":"Qiyinmi? Devorga otjimaniyadan boshlang.","Strength":"Kuch","Hands under shoulders, body in a straight line (knees down to make it easier).":"Qo‘llar yelkalar ostida, tana to‘g‘ri chiziqda (osonlashtirish uchun tizzalarda).","Lower the chest towards the floor.":"Ko‘krakni polga tomon tushiring.","Push back up without the hips sagging.":"Son osilib tushmasdan orqaga itarib ko‘tariling.","Dumbbell shoulder press":"Gantel bilan yelkadan yuqoriga itarish","Overhead strength":"Boshdan yuqoridagi kuch","Start light; pain should stay 3/10 or lower.":"Yengildan boshlang; og‘riq 3/10 yoki kam bo‘lsin.","Sit or stand with light dumbbells at shoulder height.":"Yengil gantellarni yelka balandligida ushlab o‘tiring yoki turing.","Press up in a pain-free arc.":"Og‘riqsiz yoy bo‘ylab yuqoriga itaring.","Lower over 3 s.":"3 s davomida tushiring.","Bent-over row":"Engashib tortish","Upper back, shoulder blades":"Orqa yuqori qismi, kuraklar","Keep the neck long and the back flat.":"Bo‘yin cho‘zilgan, bel tekis bo‘lsin.","Hinge forward with a flat back, weights or band in hands.":"Bel tekis holda oldinga engashing, qo‘lda gantel yoki rezina.","Pull the elbows back, squeezing the shoulder blades.":"Tirsaklarni orqaga torting, kuraklarni siqing.","Lower slowly.":"Sekin tushiring.","Prone T & Y raise":"Qorinda yotib T va Y ko‘tarish","Lower & middle trapezius":"Trapetsiya mushagining pastki va o‘rta qismi","Small lift, no shrugging.":"Kichik ko‘tarish, yelkalarni qisib ko‘tarmang.","Lie face down on a bench or the floor.":"Skameyka yoki polda yuz bilan pastga yoting.","Lift the arms out to a 'T', then up to a 'Y', thumbs up.":"Qo‘llarni «T» shaklida yonga, keyin «Y» shaklida yuqoriga ko‘taring, bosh barmoqlar yuqorida.","Band pull-apart":"Rezinani yonga cho‘zish","Rear shoulder, upper back":"Yelka orqa qismi, orqa yuqori qismi","Ribs down, don't arch the back.":"Qovurg‘alar pastda, belni bukmang.","Hold a band at shoulder height, arms straight.":"Rezinani yelka balandligida to‘g‘ri qo‘llar bilan ushlang.","Pull the band apart to touch the chest.":"Rezinani ko‘krakka tekkuncha yonga cho‘zing.","Return slowly.":"Sekin qayting.","Superman":"«Supermen»","Back extensors, glutes":"Bel yozuvchilari, dumba","Small lift is enough — no cranking the neck.":"Kichik ko‘tarish yetarli — bo‘yinni orqaga qayirmang.","Core":"Korpus","Lie face down, arms overhead.":"Yuz bilan pastga yoting, qo‘llar bosh ustida.","Lift arms, chest and legs slightly off the floor.":"Qo‘llar, ko‘krak va oyoqlarni poldan biroz ko‘taring.","Hold 3 s, lower slowly.":"3 s ushlab turing, sekin tushiring.","Wall slide":"Devor bo‘ylab sirpanish","Overhead control":"Boshdan yuqoridagi nazorat","Stop below the point of pain.":"Og‘riq nuqtasidan pastroqda to‘xtang.","Mobility":"Harakatchanlik","Forearms on a wall, elbows at shoulder height.":"Bilaklar devorda, tirsaklar yelka balandligida.","Slide arms up the wall in a pain-free range.":"Qo‘llarni og‘riqsiz oraliqda devor bo‘ylab yuqoriga sirpantiring.","Slide back down slowly.":"Sekin pastga sirpantiring.","Chin tuck":"Iyakni ichkariga tortish","Deep neck flexors":"Bo‘yinning chuqur bukuvchi mushaklari","Don't nod down — slide straight back.":"Boshni pastga egmang — to‘g‘ri orqaga suring.","Isometric":"Izometriya","Sit or stand tall, eyes level.":"Tik o‘tiring yoki turing, ko‘z to‘g‘riga qaragan.","Glide the chin straight back (make a 'double chin').":"Iyakni to‘g‘ri orqaga suring («ikki iyak» hosil qiling).","Hold 5 s, relax.":"5 s ushlab turing, bo‘shating.","Neck mobility":"Bo‘yin harakatchanligi","Neck range of motion":"Bo‘yin harakat amplitudasi","Great break from phone and desk work.":"Telefon va stol ishidan ajoyib tanaffus.","Sit or stand tall.":"Tik o‘tiring yoki turing.","Slowly nod down and up, then turn left and right.":"Boshni sekin pastga va yuqoriga egib, keyin chapga va o‘ngga buring.","Move in a comfortable range.":"Qulay oraliqda harakatlaning.","Open book":"«Ochiq kitob»","Upper back rotation":"Ko‘krak orqa qismi aylanishi","Breathe out as you open.":"Ochayotganda nafas chiqaring.","Lie on your side, knees bent, arms together in front.":"Yonboshlab yoting, tizzalar bukilgan, qo‘llar oldinda birga.","Open the top arm across to the other side, following it with your eyes.":"Ustki qo‘lni ko‘z bilan kuzatib, boshqa tomonga oching.","Seated upper-back extension":"O‘tirib orqa yuqori qismini yozish","Upper back mobility":"Orqa yuqori qismi harakatchanligi","Move from the upper back, not the low back.":"Beldan emas, orqa yuqori qismidan harakatlaning.","Sit on a chair, hands behind your head.":"Stulda o‘tiring, qo‘llar bosh orqasida.","Gently arch the upper back over the chair back, looking up.":"Yuqoriga qarab, orqa yuqori qismini stul suyanchig‘i ustida yumshoq egib oling.","Return to upright.":"Tik holatga qayting.","Doorway chest stretch":"Eshik o‘rnida ko‘krakni cho‘zish","Chest, front of shoulder":"Ko‘krak, yelka old qismi","Undoes rounded 'phone posture'.":"Bukchaygan «telefon holati»ni to‘g‘rilaydi.","Stretch":"Cho‘zish","Forearm on a door frame, elbow at shoulder height.":"Bilak eshik ramkasida, tirsak yelka balandligida.","Step through gently until you feel the chest stretch.":"Ko‘krak cho‘zilishi sezilguncha yumshoq oldinga qadam qo‘ying.","Hold, then switch sides.":"Ushlab turing, keyin tomonni almashtiring.","Arm circles":"Qo‘llarni aylantirish","Shoulder warm-up":"Yelka uchun qizish","Keep the shoulders down away from the ears.":"Yelkalarni quloqdan uzoqda, pastda tuting.","Arms out to the sides.":"Qo‘llarni yon tomonlarga uzating.","Make slow circles forward, then backward.":"Avval oldinga, so‘ng orqaga sekin doira chizing.","Grow the circles gradually.":"Doiralarni asta-sekin kattalashtiring.","Grip squeeze":"Mushtni siqish","Grip strength":"Ushlash kuchi","Squeeze with the elbow straight later in rehab.":"Reabilitatsiyaning keyingi bosqichida tirsakni to‘g‘ri tutib siqing.","Squeeze a soft ball or towel.":"Yumshoq to‘p yoki sochiqni siqing.","Hold 3–5 s.":"3–5 s ushlab turing.","Relax fully.":"To‘liq bo‘shating.","Suitcase carry":"Chamadon ko‘tarib yurish","Core anti-side-bend":"Korpus — yonga egilishga qarshi","Shoulders level the whole time.":"Butun vaqt yelkalar tekis.","Hold a heavy weight in one hand.":"Bir qo‘lda og‘ir yuk ushlang.","Walk tall for 20–30 m without leaning.":"Engashmasdan 20–30 m tik yuring.","Switch hands.":"Qo‘lni almashtiring.","Forearm plank":"Bilaklarda planka","Whole core":"Butun korpus","Squeeze glutes; don't let the hips sag.":"Dumbani siqing; son osilib tushmasin.","Forearms on the floor, elbows under shoulders.":"Bilaklar polda, tirsaklar yelkalar ostida.","Lift into a straight line from head to heels.":"Boshdan tovongacha to‘g‘ri chiziq hosil qilib ko‘tariling.","Hold and breathe.":"Ushlab turing va nafas oling.","Side plank":"Yon planka","Obliques, side of the trunk":"Qiyshiq qorin mushaklari, tananing yon tomoni","Head, hips, feet in one line.":"Bosh, son va oyoqlar bir chiziqda.","On your side, elbow under the shoulder.":"Yonboshlab, tirsak yelka ostida.","Knees bent first, then straight legs.":"Avval tizzalar bukik, keyin to‘g‘ri oyoqlar.","Lift hips into a line and hold.":"Sonni bir chiziqqa ko‘tarib ushlab turing.","Dead bug":"«O‘lik qo‘ng‘iz»","Deep core control":"Chuqur korpus nazorati","Breathe out as the limbs lower.":"Qo‘l-oyoq tushganda nafas chiqaring.","On your back, arms up, hips and knees at 90°.":"Chalqancha, qo‘llar yuqorida, son va tizzalar 90° da.","Lower opposite arm and leg slowly.":"Qarama-qarshi qo‘l va oyoqni sekin tushiring.","Keep the low back gently against the floor.":"Belni polga yumshoq bosib turing.","Bird dog":"«Qush-it» mashqi","Back extensors, core":"Bel yozuvchi mushaklar, korpus","Imagine a cup of tea on your lower back.":"Belingizda bir piyola choy turibdi deb tasavvur qiling.","On hands and knees.":"Qo‘l va tizzalarda turing.","Reach opposite arm and leg out long.":"Qarama-qarshi qo‘l va oyoqni uzoqqa cho‘zing.","Hold 5–10 s, don't rotate the hips.":"5–10 s ushlab turing, sonni burmang.","Cat–camel":"Mushuk–tuya","Spine mobility":"Umurtqa harakatchanligi","Mobility, not stretching. Keep it gentle.":"Bu harakatchanlik, cho‘zish emas. Yengil bajaring.","Slowly round the back up, then let it sag gently.":"Belni sekin yuqoriga bukring, keyin yumshoq pastga tushiring.","Move within comfort.":"Qulay chegarada harakatlaning.","Child's pose":"Bola holati","Back, hips":"Bel, son","A cushion between heels and bottom helps if knees are stiff.":"Tizzalar qotgan bo‘lsa, tovon va dumba orasiga yostiq qo‘ying.","Kneel and sit back towards your heels.":"Tiz cho‘kib, tovonlarga tomon orqaga o‘tiring.","Reach the arms forward on the floor.":"Qo‘llarni polda oldinga cho‘zing.","Relax and breathe into the back.":"Bo‘shashing va belga nafas oling.","Knee to chest":"Tizzani ko‘krakka tortish","Low back & glutes":"Bel va dumba","Breathe out and relax the back.":"Nafas chiqarib, belni bo‘shashtiring.","Lie on your back.":"Chalqancha yoting.","Pull one knee to your chest with both hands.":"Bir tizzani ikki qo‘l bilan ko‘krakka torting.","Hold, then switch.":"Ushlab turing, keyin almashtiring.","Glute bridge":"Dumba ko‘prigi","Glutes, hamstrings":"Dumba, son orqa mushaklari","Push through heels; don't arch the low back.":"Tovonlar bilan itaring; belni bukmang.","Lie on your back, knees bent, feet flat.":"Chalqancha yoting, tizzalar bukilgan, oyoqlar polda.","Squeeze glutes and lift hips into a straight line.":"Dumbani siqib, sonni to‘g‘ri chiziqqacha ko‘taring.","Single-leg bridge":"Bir oyoqli ko‘prik","Hips stay level like a table.":"Son stol kabi tekis turadi.","Bridge position, lift one foot off the floor.":"Ko‘prik holati, bir oyoqni poldan uzing.","Raise hips level, not twisting.":"Sonni burmasdan tekis ko‘taring.","Quadruped glute kickback":"To‘rt oyoqda dumba bilan orqaga tepish","Glutes":"Dumba mushaklari","Squeeze the glute at the top.":"Yuqorida dumbani siqing.","Kick one heel back and up to hip height.":"Bir tovonni orqaga va yuqoriga son balandligigacha tebing.","Lower slowly without arching the back.":"Belni bukmasdan sekin tushiring.","Clamshell":"«Chig‘anoq» mashqi","Glute medius":"O‘rta dumba mushagi","Add a band above the knees for progression.":"Murakkablashtirish uchun tizzalar ustiga rezina qo‘shing.","Lie on your side, knees bent, heels together.":"Yonboshlab yoting, tizzalar bukilgan, tovonlar birga.","Open the top knee without rolling the pelvis back.":"Chanoqni orqaga aylantirmasdan ustki tizzani oching.","Side-lying hip abduction":"Yonboshlab yotib sonni uzoqlashtirish","Strong hip abductors reduce knee 'caving in'.":"Kuchli son uzoqlashtiruvchi mushaklari tizzaning «ichkariga qayrilishi»ni kamaytiradi.","Lie on your side, bottom knee bent.":"Yonboshlab yoting, pastki tizza bukilgan.","Lift the straight top leg slightly behind the body.":"To‘g‘ri ustki oyoqni tanadan biroz orqaroqqa ko‘taring.","Lower slowly, toes pointing forward.":"Barmoqlar oldinga qaragan holda sekin tushiring.","Band side walk":"Rezina bilan yonga yurish","Toes point forward; don't let the knees cave in.":"Barmoqlar oldinga qaragan; tizzalar ichkariga qayrilmasin.","Band around the knees or ankles, knees slightly bent.":"Rezina tizzalar yoki to‘piqlar atrofida, tizzalar biroz bukik.","Step sideways, keeping tension on the band.":"Rezina tarangligini saqlab, yonga qadam tashlang.","10 steps one way, then back.":"Bir tomonga 10 qadam, keyin orqaga.","Lateral lunge":"Yonga hamla","Adductors, glutes":"Adduktorlar, dumba","Keep the bent knee in line with the foot.":"Bukilgan tizza oyoq kafti yo‘nalishida bo‘lsin.","Wide stance.":"Oyoqlar keng.","Shift to one side, bending that knee, other leg straight.":"Bir tomonga o‘tib, o‘sha tizzani buking, ikkinchi oyoq to‘g‘ri.","Push back to centre.":"O‘rtaga itarib qayting.","Standing hip circles":"Turib son bo‘g‘imini aylantirish","Hip mobility":"Son bo‘g‘imi harakatchanligi","Smooth and controlled.":"Ravon va nazoratli.","Stand on one leg, hold a support.":"Bir oyoqda turing, tayanchni ushlang.","Lift the other knee and draw big circles with it.":"Ikkinchi tizzani ko‘tarib, u bilan katta doiralar chizing.","10 each direction.":"Har tomonga 10 tadan.","Hip flexor stretch":"Son bukuvchilari
