<style>
/* Layout: a printed brand book — yellow brand field hero, ruled sections with spaced serif labels, the logo itself explained as the centrepiece */
:root{
  --navy:#1A4264; --teal:#0097B2; --orange:#D9711F; --yellow:#F9F8AF;
  --bg:#FBFCFC; --surface:#FFFFFF; --ink:#1A4264; --muted:#4E6A82; --line:#D7E2E8; --tint:#EAF4F7;
  --field:#F9F8AF; --field-ink:#1A4264;
  --display:Georgia, "Noto Serif", "Times New Roman", serif;
  --body:Calibri, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1B27; --surface:#132636; --ink:#E6EFF3; --muted:#A3BBCA; --line:#24394B; --tint:#16313F; --teal:#2DB7D1; --orange:#EE8A3C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1B27; --surface:#132636; --ink:#E6EFF3; --muted:#A3BBCA; --line:#24394B; --tint:#16313F; --teal:#2DB7D1; --orange:#EE8A3C; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 var(--body)}
img{max-width:100%;height:auto;display:block}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.label{font-family:var(--display);font-size:.78rem;letter-spacing:.28em;text-transform:uppercase;color:var(--teal)}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;border-bottom:3px solid var(--teal);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:20px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;margin-right:auto}
.brand img{height:40px;width:auto}
.brand span{font-family:var(--display);font-size:1.3rem;letter-spacing:.3em}
.nav{display:flex;gap:4px;align-items:center}
.nav a{text-decoration:none;color:#CFE4EB;font-size:.95rem;padding:8px 10px;border-radius:8px}
.nav a:hover{color:#fff;background:rgba(255,255,255,.1)}
.lang{display:flex;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:2px}
.lang button{border:0;background:none;color:#CFE4EB;font:600 .8rem var(--body);padding:5px 10px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--navy)}
@media (max-width:760px){.nav a{display:none}}

/* hero */
.hero{background:var(--field);color:var(--field-ink);border-bottom:1px solid #E6E39A}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:48px;align-items:center;padding-block:64px 56px}
.hero .label{color:#7A6A12}
.hero h1{font-size:clamp(2.6rem,6.4vw,4.6rem);letter-spacing:-.01em;margin:14px 0 18px}
.hero h1 em{font-style:normal;color:var(--teal)}
.hero p.lede{font-size:1.18rem;max-width:34em;color:#2B5272}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:700;border-radius:10px;padding:13px 20px;border:2px solid var(--navy)}
.btn.solid{background:var(--navy);color:#fff}
.btn.solid:hover{background:#11304A}
.btn.ghost{color:var(--navy)}
.btn.ghost:hover{background:rgba(26,66,100,.08)}
.hero-logo{justify-self:center;width:min(100%,380px);animation:rise .9s ease-out both}
@keyframes rise{from{transform:translateY(10px)}to{transform:none}}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;padding-block:40px;gap:28px}.hero-logo{order:-1;width:min(70%,260px)}}

/* facts strip */
.facts{border-bottom:1px solid var(--line);background:var(--surface)}
.facts .wrap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0}
.fact{padding:22px 18px;border-left:1px solid var(--line)}
.fact:first-child{border-left:0;padding-left:0}
.fact b{display:block;font-family:var(--display);font-size:2rem;font-weight:400;color:var(--teal);font-variant-numeric:tabular-nums;line-height:1.1}
.fact span{font-size:.92rem;color:var(--muted)}
@media (max-width:760px){.facts .wrap{grid-template-columns:repeat(2,minmax(0,1fr))}.fact:nth-child(3){border-left:0;padding-left:0}.fact{border-top:1px solid var(--line)}.fact:nth-child(-n+2){border-top:0}}

/* sections */
section.block{padding-block:72px;border-bottom:1px solid var(--line)}
.head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:32px;margin-bottom:40px;align-items:end}
.head h2{font-size:clamp(1.9rem,3.6vw,2.7rem);margin-top:10px}
.head p{color:var(--muted);max-width:36em}
@media (max-width:820px){.head{grid-template-columns:1fr;gap:12px}}

/* divisions */
.divs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:760px){.divs{grid-template-columns:1fr}}
.div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px;display:grid;gap:14px;align-content:start;position:relative}
.div .num{font-family:var(--display);font-size:.85rem;letter-spacing:.2em;color:var(--muted)}
.div h3{font-size:1.6rem}
.div p{color:var(--muted)}
.div ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.div li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:baseline;padding-top:8px;border-top:1px solid var(--line);font-size:.98rem}
.chip{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip.live{background:#DDF3E6;color:#1E6B42}
.chip.soon{background:var(--tint);color:var(--muted)}
.chip.open{background:#FBEBDD;color:#9A4A0E}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.live{background:#173D2A;color:#8FE0B3}:root:not([data-theme="light"]) .chip.open{background:#3A2614;color:#F5B57E}}
:root[data-theme="dark"] .chip.live{background:#173D2A;color:#8FE0B3}
:root[data-theme="dark"] .chip.open{background:#3A2614;color:#F5B57E}
.div a.more{font-weight:700;color:var(--teal);text-decoration:none}
.div a.more:hover{text-decoration:underline}

/* logo explained */
.explain{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
@media (max-width:820px){.explain{grid-template-columns:1fr}}
.markbox{position:relative;background:var(--field);border-radius:20px;padding:28px}
.markbox .inner{position:relative}
.pin{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;font:700 .9rem var(--body);display:grid;place-items:center;transform:translate(-50%,-50%);box-shadow:0 0 0 4px var(--field)}
.parts{list-style:none;margin:0;padding:0;display:grid;gap:18px}
.parts li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:16px}
.parts .n{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;font-weight:700;display:grid;place-items:center;font-size:.9rem}
.parts b{display:block;font-family:var(--display);font-weight:400;font-size:1.2rem}
.parts span{color:var(--muted)}

/* apps */
.apps{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:32px;align-items:center}
@media (max-width:820px){.apps{grid-template-columns:1fr}}
.feature{background:var(--navy);color:#fff;border-radius:20px;padding:32px;display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:28px;align-items:center}
@media (max-width:560px){.feature{grid-template-columns:1fr}.feature img{max-width:200px;justify-self:center}}
.feature .label{color:#8FD6E6}
.feature h3{font-size:2rem;margin:8px 0 10px}
.feature p{color:#CFE0E8}
.feature ul{margin:14px 0 22px;padding-left:18px;color:#E3EEF2}
.feature .btn.solid{background:var(--orange);border-color:var(--orange)}
.feature img{border-radius:18px;border:4px solid rgba(255,255,255,.15)}
.roadmap{display:grid;gap:12px}
.rm{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.rm b{display:block;font-weight:700}
.rm span.d{color:var(--muted);font-size:.92rem}

/* principles */
.principles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px}
@media (max-width:900px){.principles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.principles{grid-template-columns:1fr}}
.pr{border-top:3px solid var(--teal);padding-top:16px;display:grid;gap:8px}
.pr h3{font-size:1.25rem}
.pr p{color:var(--muted);font-size:.98rem}

/* contact */
.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:start}
@media (max-width:820px){.contact{grid-template-columns:1fr}}
.links{display:grid;gap:10px}
.links a{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 18px}
.links a:hover{border-color:var(--teal)}
.links div{display:grid;gap:2px}
.links b{font-weight:700}
.links span{color:var(--muted);font-size:.92rem}
.links i{font-style:normal;color:var(--teal);font-weight:700}

.ch{font-size:clamp(1.9rem,3.6vw,2.7rem);margin-top:10px}
.ct{color:var(--muted);margin-top:14px;max-width:32em}
section.block.last{border-bottom:0}
.div li a,.rm b a{color:inherit;text-decoration-color:var(--teal);text-underline-offset:3px}
footer{background:var(--navy);color:#CFE0E8;padding-block:44px calc(32px + env(safe-area-inset-bottom,0px))}
footer .wrap{display:grid;gap:22px}
.fbrand{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.fbrand img{height:84px;width:auto}
.fbrand p{font-family:var(--display);letter-spacing:.22em;color:#fff}
.flinks{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.92rem}
.flinks a{color:#fff}
.fine{font-size:.8rem;color:#A9C6D2;border-top:1px solid rgba(255,255,255,.15);padding-top:16px}
</style>
</head>
<body>
<header class="top"><div class="wrap" id="hdr"><!--HEADER--></div></header>
<main id="top">
<!--MAIN-->
</main>
<footer><div class="wrap" id="ftr"><!--FOOTER--></div></footer>
<script type="application/json" id="site-data"><!--DATA--></script>
<script src="assets/site.js"></script>
</body>
</html>
