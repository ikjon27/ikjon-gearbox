<style>
:root{
  --navy:#1A4264; --navy-2:#12324D; --teal:#0097B2; --orange:#D9711F;
  --bg:#FFFFFF; --surface:#FFFFFF; --soft:#F4F7F9; --ink:#14283A; --muted:#506477; --line:#DDE5EB;
  --sans:"Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1B27; --surface:#132636; --soft:#10212F; --ink:#E6EFF3; --muted:#A3BBCA; --line:#24394B; --teal:#2DB7D1; --orange:#EE8A3C; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1B27; --surface:#132636; --soft:#10212F; --ink:#E6EFF3; --muted:#A3BBCA; --line:#24394B; --teal:#2DB7D1; --orange:#EE8A3C; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:80px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 var(--sans)}
img{max-width:100%;height:auto;display:block}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:4px}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-weight:700;line-height:1.2;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.label{font-size:.78rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* header */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top,0px);box-shadow:0 1px 0 rgba(255,255,255,.08)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:66px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;margin-right:auto}
.brand img{height:36px;width:auto}
.brand span{font-size:1.15rem;font-weight:700;letter-spacing:.24em}
.nav{display:flex;gap:2px}
.nav a{text-decoration:none;color:#D2E2EC;font-size:.94rem;padding:8px 12px;border-radius:6px}
.nav a:hover{color:#fff;background:rgba(255,255,255,.08)}
.lang{display:flex;border:1px solid rgba(255,255,255,.28);border-radius:6px;padding:2px}
.lang button{border:0;background:none;color:#D2E2EC;font:600 .78rem var(--sans);padding:5px 9px;border-radius:4px;cursor:pointer}
.lang button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.signin{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:6px;border:1px solid rgba(255,255,255,.4);color:#fff;text-decoration:none;font:600 .86rem var(--sans);white-space:nowrap}
.signin:hover{background:rgba(255,255,255,.1)}
@media (max-width:880px){.nav{display:none}}
@media (max-width:420px){.signin{padding:7px 10px}.brand span{letter-spacing:.16em}}

/* hero */
.hero{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-2) 100%);color:#fff}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,.65fr);gap:48px;align-items:center;padding-block:88px 96px}
.kicker{font-size:.82rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#8FD6E6}
.hero h1{font-size:clamp(2.2rem,4.6vw,3.5rem);margin:18px 0 20px;max-width:16em}
.lede{font-size:clamp(1.05rem,1.5vw,1.2rem);color:#D0DFEA;max-width:34em}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font-weight:600;border-radius:8px;padding:14px 22px;border:1px solid transparent;font-size:1rem;transition:background .15s,border-color .15s}
.btn.solid{background:var(--orange);color:#fff}
.btn.solid:hover{background:#C3631A}
.btn.ghost{color:#fff;border-color:rgba(255,255,255,.45)}
.btn.ghost:hover{background:rgba(255,255,255,.08);border-color:#fff}
.btn small{font-size:.85em;color:#A9C6D6;font-weight:500}
.btn:focus-visible{outline:3px solid #8FD6E6}
.hero-mark{justify-self:end;width:min(100%,300px);opacity:.92}
.hero.small .wrap{grid-template-columns:1fr;padding-block:56px 64px}
.crumbs{font-size:.9rem;color:#A9C6D6}.crumbs a{color:#fff}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr;padding-block:56px 64px;gap:28px}.hero-mark{display:none}}
@media (max-width:480px){.cta .btn{width:100%;justify-content:center}}

/* sections */
section.block{padding-block:88px}
section.block.tint{background:var(--soft)}
section.block.navy{background:var(--navy);color:#fff}
.head{max-width:44em;margin-bottom:44px}
.head h2,.contact h2{font-size:clamp(1.75rem,3.2vw,2.4rem);margin-top:10px}
.intro{color:var(--muted);margin-top:14px;font-size:1.06rem}
.navy .label{color:#8FD6E6}.navy .intro{color:#C9DAE5}
@media (max-width:600px){section.block{padding-block:64px}}

/* cards */
.cards{display:grid;gap:24px}
.cards.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:820px){.cards.two{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;transition:border-color .15s,box-shadow .15s}
.card:hover{border-color:#B8CCD8;box-shadow:0 12px 30px -18px rgba(13,27,39,.35)}
.cimg{aspect-ratio:2/1;overflow:hidden;background:var(--soft)}
.cimg img{width:100%;height:100%;object-fit:cover}
.card.later .cimg img{filter:saturate(.5)}
.cbody{padding:26px 28px 28px;display:flex;flex-direction:column;gap:12px;flex:1}
.ctop{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cbody h3{font-size:1.4rem}
.cbody>p{color:var(--muted)}
.ticks{list-style:none;margin:4px 0 0;padding:0;display:grid;gap:8px;font-size:.98rem}
.ticks li{position:relative;padding-left:26px}
.ticks li::before{content:"";position:absolute;left:2px;top:.5em;width:12px;height:7px;border-left:2px solid var(--teal);border-bottom:2px solid var(--teal);transform:rotate(-45deg)}
.cact{margin-top:auto;padding-top:14px}
.cbtn{display:inline-flex;align-items:center;gap:10px;background:var(--navy);color:#fff;text-decoration:none;font-weight:600;padding:12px 20px;border-radius:8px}
.cbtn:hover{background:var(--navy-2)}
.cbtn.off{background:transparent;color:var(--muted);border:1px dashed var(--line);cursor:default}
:root[data-theme="dark"] .cbtn:not(.off){background:var(--teal);color:#06202B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .cbtn:not(.off){background:var(--teal);color:#06202B}}
.chip{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip.live{background:#DDF3E6;color:#1E6B42}
.chip.soon{background:#EEF2F5;color:#5A6B7A}
:root[data-theme="dark"] .chip.live{background:#173D2A;color:#8FE0B3}:root[data-theme="dark"] .chip.soon{background:#1C3142;color:#A3BBCA}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.live{background:#173D2A;color:#8FE0B3}:root:not([data-theme="light"]) .chip.soon{background:#1C3142;color:#A3BBCA}}
.note{margin-top:32px;padding:16px 20px;border-left:3px solid var(--orange);background:var(--soft);color:var(--muted);font-size:.95rem;border-radius:0 8px 8px 0}

/* columns */
.cols{display:grid;gap:36px}
.cols.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.cols.four{grid-template-columns:repeat(4,minmax(0,1fr));gap:32px}
@media (max-width:900px){.cols.three{grid-template-columns:1fr}.cols.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.cols.four{grid-template-columns:1fr}}
.col{display:grid;gap:10px;align-content:start}
.col h3{font-size:1.2rem}
.col p{color:var(--muted)}
.num{font-size:.85rem;font-weight:700;color:var(--orange);letter-spacing:.08em}
.col.rule{border-top:2px solid var(--teal);padding-top:18px}

/* goals */
.goals{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:760px){.goals{grid-template-columns:1fr}}
.goals li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:18px;padding:24px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:rgba(255,255,255,.04)}
.gn{width:44px;height:44px;border-radius:50%;border:2px solid var(--orange);color:#fff;font-weight:700;display:grid;place-items:center}
.goals h3{font-size:1.15rem;margin-bottom:6px}
.goals p{color:#C9DAE5}

/* contact */
.contact{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start}
@media (max-width:820px){.contact{grid-template-columns:1fr}}
.links{display:grid;gap:10px}
.links a{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px}
.links a:hover{border-color:var(--teal)}
.links div{display:grid;gap:2px}
.links b{font-weight:600}
.links span{color:var(--muted);font-size:.92rem}
.links i{font-style:normal;color:var(--teal);font-weight:700}

footer{background:var(--navy-2);color:#CFE0E8;padding-block:44px calc(32px + env(safe-area-inset-bottom,0px))}
footer .wrap{display:grid;gap:22px}
.fbrand{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.fbrand img{height:72px;width:auto}
.fbrand p{letter-spacing:.2em;font-size:.85rem;color:#fff}
.flinks{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:.92rem}
.flinks a{color:#fff;text-decoration:none}.flinks a:hover{text-decoration:underline}
.fine{font-size:.8rem;color:#A9C6D2;border-top:1px solid rgba(255,255,255,.15);padding-top:16px}
</style>
</head>
