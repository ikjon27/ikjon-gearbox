# Rebuilds index.html from content/site.json after every edit made in /admin,
# so Google always sees the latest words. Uses only GitHub's own tools.
name: Build home page
on:
  push:
    branches: [main]
    paths: ["content/**", "assets/site.js", "tools/**"]
  workflow_dispatch:
permissions:
  contents: write   # only what is needed to save index.html
concurrency:
  group: build-home
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1 (pinned)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (pinned)
        with:
          node-version: 20
      - run: node tools/build.js
      - name: Save the rebuilt page
        run: |
          if git diff --quiet -- index.html sport/index.html && [ -z "$(git ls-files --others --exclude-standard sport/index.html)" ]; then echo "No change"; exit 0; fi
          git config user.name "ikjon-website-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html sport/index.html
          git commit -m "Rebuild home page from content"
          git push
