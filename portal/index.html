<title>IKJON Consulting Centre — Portal</title>
<meta name="description" content="Sign-in portal for IKJON Consulting & Education Centre staff and students.">

<meta name="referrer" content="no-referrer">

<meta name="color-scheme" content="light dark">
<link rel="icon" href="/rehab/icons/favicon-48.png" sizes="48x48" type="image/png">
<style>
:root{
  --navy:#1A4264;--navy-d:#0B2236;--teal:#0097B2;--orange:#D9711F;--orange-l:#F08A35;
  --bg:#F3F6F9;--surface:#FFFFFF;--ink:#13304A;--muted:#5A7186;--line:#DCE5EC;--tint:#E8F3F7;--good:#1E7B4A;--bad:#B3261E;
  --side:#0B2236;--side-ink:#CFE0EA;
  --body:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;--display:Georgia,"Noto Serif",serif;
  color-scheme:light
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A1620;--surface:#11222F;--ink:#E4EEF4;--muted:#9DB4C4;--line:#213648;--tint:#14303E;--teal:#2DB7D1;--orange:#EE8A3C;--good:#6FD39C;--bad:#F2B8B5;--side:#071521;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0A1620;--surface:#11222F;--ink:#E4EEF4;--muted:#9DB4C4;--line:#213648;--tint:#14303E;--teal:#2DB7D1;--orange:#EE8A3C;--good:#6FD39C;--bad:#F2B8B5;--side:#071521;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body)}
a{color:var(--teal)}button,input,select,textarea{font:inherit;color:inherit}
[hidden]{display:none!important}
h1,h2,h3{margin:0;line-height:1.2}
.muted{color:var(--muted)}.small{font-size:.88rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;text-decoration:none;background:linear-gradient(135deg,var(--orange-l),var(--orange));color:#fff;box-shadow:0 8px 20px -10px rgba(217,113,31,.8)}
.btn:hover{filter:brightness(1.05)}.btn:focus-visible,.nav a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.btn.alt{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);box-shadow:none}.btn.alt:hover{border-color:var(--teal)}
.btn.sm{padding:8px 13px;font-size:.9rem;border-radius:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:3px 10px;background:var(--tint);color:var(--teal)}
.chip.o{background:rgba(217,113,31,.14);color:var(--orange)}.chip.g{background:rgba(30,123,74,.14);color:var(--good)}.chip.lock{background:var(--line);color:var(--muted)}
input,select,textarea{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}
label.f{display:block;font-weight:700;font-size:.9rem;margin:14px 0 6px}

/* ---------- sign in ---------- */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}
.login-art{position:relative;overflow:hidden;color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(900px 500px at 90% 0%,rgba(0,151,178,.5),transparent 60%),radial-gradient(600px 400px at 0% 100%,rgba(217,113,31,.4),transparent 60%),linear-gradient(160deg,#0B2236,#123A5A 60%,#1A4264)}
.login-art::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.2px);background-size:22px 22px}
.login-art>*{position:relative}
.brandrow{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}.brandrow img{height:42px;width:auto}
.brandrow b{font-family:var(--display);font-weight:400;letter-spacing:.3em;font-size:1.25rem}
.login-art h1{font-size:clamp(2rem,4vw,3.2rem);font-weight:800;letter-spacing:-.03em;line-height:1.05;max-width:12em}
.login-art h1 em{font-style:normal;color:#F59A4E}
.login-art ul{list-style:none;padding:0;margin:24px 0 0;display:grid;gap:10px;color:#CFE3EE}
.login-art li::before{content:"✓";display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:rgba(0,151,178,.35);color:#9FEAF8;font-size:.75rem;font-weight:800;margin-right:10px}
.login-form{display:grid;place-items:center;padding:40px 24px;background:var(--surface)}
.card-login{width:min(100%,400px)}
.card-login h2{font-size:1.7rem;margin-bottom:6px}
.err{color:var(--bad);font-weight:700;margin-top:10px;min-height:1.4em}
.demo{margin-top:22px;padding:16px;border-radius:14px;background:var(--tint);border:1px dashed var(--teal)}
.demo .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.langsw{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:rgba(255,255,255,.12)}
.langsw button{border:0;background:none;color:inherit;padding:5px 11px;border-radius:999px;font-weight:700;font-size:.8rem;cursor:pointer}
.langsw button[aria-pressed="true"]{background:#fff;color:#0B2236}
@media (max-width:860px){.login{grid-template-columns:1fr}.login-art{padding:28px 20px;min-height:auto}.login-art ul{display:none}.login-art h1{font-size:1.9rem;margin-top:22px}}

/* ---------- app shell ---------- */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:var(--side);color:var(--side-ink);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:18px}
.side .brandrow img{height:34px}.side .brandrow b{font-size:1.05rem}
.side .sub{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#7FA8BF;margin-top:-8px;padding-left:2px}
.nav{display:grid;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;color:var(--side-ink);text-decoration:none;font-weight:600}
.nav a svg{flex:none;opacity:.85}
.nav a:hover{background:rgba(255,255,255,.06)}
.nav a[aria-current]{background:linear-gradient(135deg,rgba(0,151,178,.35),rgba(0,151,178,.15));color:#fff;box-shadow:inset 3px 0 0 #2DB7D1}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;background:rgba(255,255,255,.05)}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--teal),#0B6F84);flex:none}
.me b{display:block;color:#fff;font-size:.95rem}.me span{font-size:.78rem;color:#8FB3C7}
.me button{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:10px;padding:6px 9px;cursor:pointer;font-size:.8rem}
.main{padding:28px clamp(16px,3vw,40px) 90px;max-width:1200px;width:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.topbar h1{font-size:clamp(1.5rem,2.6vw,2rem);font-weight:800;letter-spacing:-.02em}
.preview{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:rgba(217,113,31,.12);color:var(--ink);border:1px solid rgba(217,113,31,.35);border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:.92rem}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:0 1px 2px rgba(10,30,45,.04),0 10px 26px -18px rgba(10,30,45,.25)}
.card h3{font-size:1.05rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.welcome{position:relative;overflow:hidden;color:#fff;border:0;background:radial-gradient(500px 260px at 100% 0%,rgba(0,151,178,.55),transparent 60%),linear-gradient(135deg,#0B2236,#1A4264)}
.welcome h2{font-size:clamp(1.4rem,2.6vw,1.9rem);font-weight:800;letter-spacing:-.02em}
.welcome p{color:#CFE3EE;margin:6px 0 0}
.welcome .stats{display:flex;gap:24px;flex-wrap:wrap;margin-top:18px}
.welcome .stats b{display:block;font-size:1.6rem;font-weight:800;color:#fff}.welcome .stats span{font-size:.82rem;color:#A9CADB}
.kpi b{display:block;font-size:1.9rem;font-weight:800;letter-spacing:-.02em}.kpi span{color:var(--muted);font-size:.9rem}
.list{list-style:none;margin:0;padding:0;display:grid}
.list li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.list li:first-child{border-top:0;padding-top:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--teal);margin-top:7px;flex:none}.dot.o{background:var(--orange)}
.bar{height:9px;border-radius:999px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--teal),#2DB7D1)}
.course{display:flex;flex-direction:column;gap:10px}
.course .top{display:flex;align-items:center;gap:12px}
.cico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;flex:none}
.units{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:6px}
.units li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px;border-radius:10px;background:var(--bg);font-size:.93rem}
.units li.locked{color:var(--muted)}
.tt{width:100%;border-collapse:separate;border-spacing:0;font-size:.92rem}
.tt th,.tt td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tt th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.slot{display:block;padding:8px 10px;border-radius:10px;background:var(--tint);border-left:4px solid var(--teal);margin-bottom:6px}.slot b{display:block}.slot.o{background:rgba(217,113,31,.1);border-left-color:var(--orange)}
.tblwrap{overflow-x:auto}
.apptile{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
.apptile:hover{transform:translateY(-3px);border-color:var(--teal)}
.apptile .cico{width:54px;height:54px;font-size:1.6rem}
.cert{display:flex;gap:14px;align-items:center}
.cert .medal{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;background:linear-gradient(135deg,#FFD58A,#D9711F);flex:none}
table.people{width:100%;border-collapse:collapse;font-size:.93rem}table.people th,table.people td{padding:10px;border-bottom:1px solid var(--line);text-align:left}
table.people th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--good);color:#fff;font-weight:700;padding:12px 18px;border-radius:12px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);z-index:50}
dialog{border:0;border-radius:18px;padding:0;max-width:min(560px,94vw);width:100%;background:var(--surface);color:var(--ink);box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(5,15,25,.55)}
.dlg{padding:22px}
/* certificate (also printable) */
.certificate{background:#FFFDF6;color:#13304A;border:10px solid #1A4264;outline:2px solid #D9711F;outline-offset:-18px;padding:46px 40px;text-align:center;font-family:var(--display);aspect-ratio:1.414/1;display:flex;flex-direction:column;justify-content:center;gap:10px}
.certificate .t{letter-spacing:.35em;font-size:.9rem;color:#0097B2}.certificate h2{font-size:2.2rem;font-weight:400}.certificate .n{font-size:2rem;color:#D9711F;border-bottom:1px solid #D9711F;display:inline-block;padding:0 24px 6px;margin:6px auto}
.certificate .row{display:flex;justify-content:space-between;margin-top:22px;font-family:var(--body);font-size:.85rem}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:fixed;inset:0;margin:0}}
/* mobile */
.bnav{display:none}
@media (max-width:900px){
 .shell{grid-template-columns:1fr}.side{display:none}
 .bnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--side);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;gap:2px}
 .bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:#9DB8C8;text-decoration:none;font-size:.68rem;font-weight:700;padding:6px 2px;border-radius:10px}
 .bnav a[aria-current]{color:#fff;background:rgba(0,151,178,.3)}
 .mtop{display:flex!important}
}
.mtop{display:none;align-items:center;justify-content:space-between;background:var(--side);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:20}
.mtop .brandrow img{height:30px}.mtop .brandrow b{font-size:.95rem}
.mtop button{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:10px;padding:6px 10px;font-size:.8rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

async function authCall(grant,body){const r=await fetch(CONFIG.supabaseUrl+"/auth/v1/token?grant_type="+grant,{method:"POST",headers:{apikey:CONFIG.anonKey,"Content-Type":"application/json"},body:JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error_description||j.msg||"sign-in failed");AUTH={at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in-60)*1000,uid:j.user.id};saveAuth();return AUTH}
async function token(){if(!AUTH)throw new Error("signed out");if(Date.now()>AUTH.exp)await authCall("refresh_token",{refresh_token:AUTH.rt});return AUTH.at}
async function api(path,opt={}){const r=await fetch(CONFIG.supabaseUrl+path,Object.assign({},opt,{headers:Object.assign({apikey:CONFIG.anonKey,Authorization:"Bearer "+await token(),"Content-Type":"application/json"},opt.headers||{})}));
 if(r.status===401){AUTH=null;saveAuth();S.user=null;render();throw new Error("session ended")}const j=await r.json().catch(()=>null);if(!r.ok)throw new Error((j&&(j.message||j.error))||("HTTP "+r.status));return j}

 <div class="card tblwrap"><table class="people"><thead><tr><th>${t("name")}</th><th>${t("role")}</th><th>${t("group")}</th><th>${t("status")}</th></tr></thead><tbody>${list.map(x=>`<tr><td><div style="display:flex;gap:10px;align-items:center"><span class="av" style="width:32px;height:32px;font-size:.8rem">${esc(initials(x.name))}</span><b>${esc(x.name)}</b></div></td><td>${esc(t(x.role))}</td><td>${esc((x.groups||[]).map(gname).join(", ")||"—")}</td><td><span class="chip g">${t("active")}</span></td></tr>`).join("")}</tbody></table></div>`}
function settingsView(){return `<div class="grid g2"><section class="card"><h3>🌐 ${t("setp")}</h3><div style="display:flex;gap:8px">${[["en","English"],["uz","O'zbekcha"]].map(([k,n])=>`<button class="btn ${LANG===k?"":"alt"} sm" data-lang="${k}">${n}</button>`).join("")}</div>
 <h3 style="margin-top:18px">🎨 ${t("theme")}</h3><div style="display:flex;gap:8px;flex-wrap:wrap">${["auto","light","dark"].map(k=>`<button class="btn ${S.theme===k?"":"alt"} sm" data-theme="${k}">${t(k)}</button>`).join("")}</div></section>
 <section class="card"><h3>🔒 ${t("security")}</h3><ul class="list"><li><span class="dot"></span><span>${t("sec1")}</span></li><li><span class="dot"></span><span>${t("sec2")}</span></li></ul></section></div>`}
const VIEWS={dash:dashView,courses:coursesView,tt:ttView,news:newsView,prog:progView,apps:appsView,people:peopleView,settings:settingsView};

/* ---------- render ---------- */
const root=document.getElementById("root");
function loginView(){document.title="IKJON Consulting Centre — "+t("signin");
 return `<div class="login"><section class="login-art"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><a class="brandrow" href="/"><img src="/rehab/brand/mark-white.png" alt=""><b>IKJON</b></a>
  <div class="langsw" role="group" aria-label="Language">${["en","uz"].map(k=>`<button data-lang="${k}" aria-pressed="${LANG===k}">${k.toUpperCase()}</button>`).join("")}</div></div>
  <div><p style="letter-spacing:.18em;text-transform:uppercase;font-size:.78rem;color:#8FD6E6;font-weight:700;margin:0 0 14px">${t("tag")} · ${t("portal")}</p><h1>${t("h1a")} <em>${t("h1b")}</em></h1>
  <ul><li>${t("p1")}</li><li>${t("p2")}</li><li>${t("p3")}</li><li>${t("p4")}</li></ul></div><p class="small" style="color:#8FB3C7;margin:0">Build • Improve • Grow</p></section>
 <section class="login-form"><div class="card-login"><h2>${t("signin")}</h2><p class="muted" style="margin:0 0 8px">${t("signin_p")}</p>
  <form id="lf" novalidate autocomplete="on"><label class="f" for="lu">${t("login")}</label><input id="lu" name="username" autocomplete="username" required>
  <label class="f" for="lp">${t("pass")}</label><input id="lp" name="password" type="password" autocomplete="current-password" required>
  <div class="err" id="lerr" role="alert"></div><button class="btn" style="width:100%" type="submit">${t("go")}</button></form>
  <p class="small muted" style="margin-top:12px">${t("forgot")}</p>
  ${PREVIEW?`<div class="demo"><b>🧪 ${t("demo_h")}</b><div class="small muted">${t("demo_p")}</div><div class="row">${[["u1","as_owner"],["u2","as_teacher"],["u3","as_student"]].map(([id,k])=>`<button class="btn alt sm" data-as="${id}">${t(k)}</button>`).join("")}</div></div>`:""}
  <p style="margin-top:22px"><a href="/" class="small">${t("back")}</a></p></div></section></div>`}
function shellView(u){const nav=NAV(u);document.title="IKJON Consulting Centre — "+t(S.view);
 return `<div class="mtop"><a class="brandrow" href="#dash" data-go="dash"><img src="/rehab/brand/mark-white.png" alt=""><b>IKJON</b></a><button id="soM">${t("signout")}</button></div>
 <div class="shell"><aside class="side"><a class="brandrow" href="#dash" data-go="dash"><img src="/rehab/brand/mark-white.png" alt=""><b>IKJON</b></a><div class="sub">Consulting Centre · ${t("portal")}</div>
  <nav class="nav" aria-label="Portal">${nav.map(([k])=>`<a href="#${k}" data-go="${k}"${S.view===k?' aria-current="page"':""}>${I(k)}${t(k)}</a>`).join("")}</nav>
  <div class="me"><span class="av">${esc(initials(u.name))}</span><div><b>${esc(u.name)}</b><span>${esc(t(u.role))}</span></div><button id="so">${t("signout")}</button></div></aside>
 <main class="main" id="main">${PREVIEW?`<div class="preview">🧪 <span>${t("prev_bar")}</span></div>`:""}
  <div class="topbar"><h1>${t(S.view)}</h1></div>${(VIEWS[S.view]||dashView)(u)}</main></div>
 <nav class="bnav" aria-label="Portal">${nav.filter(([k])=>k!=="settings"&&k!=="people").slice(0,5).map(([k])=>`<a href="#${k}" data-go="${k}"${S.view===k?' aria-current="page"':""}>${I(k)}<span>${t(k)}</span></a>`).join("")}</nav>`}
function render(){document.documentElement.lang=LANG;applyTheme();const u=me();
 if(u&&u.role==="student"&&S.view==="people")S.view="dash";
 root.innerHTML=u?shellView(u):loginView();bind();}
function toast(m){const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
function openCert(id){const u=me(),c=(D.certs[u.id]||[]).find(x=>x.id===id);if(!c)return;const dl=document.getElementById("dlg");
 document.getElementById("dlgBody").innerHTML=`<div id="printArea"><div class="certificate"><div class="t">IKJON CONSULTING &amp; EDUCATION CENTRE</div><h2>${t("certof")}</h2><div class="small" style="font-family:var(--body)">${LANG==="uz"?"":"This certificate "+t("awarded")}</div><div class="n">${esc(u.name)}</div><div class="small" style="font-family:var(--body)">${LANG==="uz"?esc(u.name)+" "+t("awarded")+" — ":""}${t("forcomp")}</div><h2 style="font-size:1.6rem">${esc(c.title)}</h2>
 <div class="row"><span>${t("date")}: ${esc(fmtDate(c.date))}</span><span>${t("certid")} ${esc(c.id)}</span><span>${t("director")}: ____________</span></div></div></div>
 <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px"><button class="btn alt" id="dc">${t("close")}</button><button class="btn" id="dp">${t("print")}</button></div>`;
 dl.showModal();document.getElementById("dc").onclick=()=>dl.close();document.getElementById("dp").onclick=()=>window.print()}
function bind(){
 root.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;save();render()});
 root.querySelectorAll("[data-as]").forEach(b=>b.onclick=()=>{S.user=b.dataset.as;S.view="dash";save();render();scrollTo(0,0)});
 root.querySelectorAll("[data-go]").forEach(a=>a.onclick=e=>{e.preventDefault();S.view=a.dataset.go;save();render();scrollTo(0,0)});
 root.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{S.theme=b.dataset.theme;save();render()});
 root.querySelectorAll("[data-cert]").forEach(b=>b.onclick=()=>openCert(b.dataset.cert));
 const lf=document.getElementById("lf");if(lf)lf.onsubmit=async e=>{e.preventDefault();const er=document.getElementById("lerr");if(PREVIEW){er.textContent=t("demo_err");return}
  const btn=lf.querySelector("button");btn.disabled=true;er.textContent=t("loading");
  try{await authCall("password",{email:toEmail(document.getElementById("lu").value),password:document.getElementById("lp").value});await loadAll();S.view="dash";save();render()}
  catch(x){AUTH=null;saveAuth();er.textContent=/inactive/.test(x.message)?t("inactive"):/fetch|network/i.test(x.message)?t("neterr"):t("bad");btn.disabled=false}};
 const so=()=>{if(!PREVIEW&&AUTH){fetch(CONFIG.supabaseUrl+"/auth/v1/logout",{method:"POST",headers:{apikey:CONFIG.anonKey,Authorization:"Bearer "+AUTH.at}}).catch(()=>{});AUTH=null;saveAuth()}S.user=null;S.view="dash";save();render()};["so","soM"].forEach(id=>{const b=document.getElementById(id);if(b)b.onclick=so});
 const pb=document.getElementById("postBtn");if(pb)pb.onclick=()=>{const ti=document.getElementById("nt").value.trim(),bo=document.getElementById("nb").value.trim();if(!ti||!bo)return;
  const aud=document.getElementById("na").value;
  if(PREVIEW){D.news.unshift({id:"n"+Date.now(),title:ti,body:bo,date:new Date().toISOString().slice(0,10),aud,by:S.user});render();toast(t("posted"));return}
  pb.disabled=true;api("/rest/v1/announcements",{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({title:ti,body:bo,group_id:aud==="all"?null:aud})}).then(loadAll).then(()=>{render();toast(t("posted"))}).catch(x=>{pb.disabled=false;toast(x.message)})};
 const ab=document.getElementById("addBtn");if(ab)ab.onclick=()=>{const n=document.getElementById("pn").value.trim();if(!n)return;const r=(document.getElementById("pr")||{}).value||"student";
  const g=document.getElementById("pg").value;
  if(PREVIEW){D.users.push({id:"u"+Date.now(),name:n,role:r,groups:[g]});render();toast(t("created"));return}
  const login=n.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g,".").replace(/^\.|\.$/g,"").slice(0,30)+"."+Math.floor(100+Math.random()*900),password=genPass();ab.disabled=true;
  api("/functions/v1/create-user",{method:"POST",body:JSON.stringify({full_name:n,login,password,role:r,group_id:g})}).then(async res=>{await loadAll();render();
   const dl=document.getElementById("dlg");document.getElementById("dlgBody").innerHTML=`<div id="printArea"><h3>IKJON Consulting Centre — ${esc(t("portal"))}</h3><p>${esc(t("pass_once"))}</p><p style="font-size:1.1rem"><b>${esc(n)}</b><br>${esc(t("login"))}: <code>${esc(login)}</code><br>${esc(t("pass"))}: <code>${esc(password)}</code><br>www.ikjon-gearbox.com/portal/</p></div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px"><button class="btn alt" id="dc">${t("close")}</button><button class="btn" id="dp">${t("print_slip")}</button></div>`;
   dl.showModal();document.getElementById("dc").onclick=()=>dl.close();document.getElementById("dp").onclick=()=>window.print()}).catch(x=>{ab.disabled=false;toast(x.message)})};
}
/* auto sign-out after 30 minutes without activity */
let idle;const resetIdle=()=>{clearTimeout(idle);idle=setTimeout(()=>{if(S.user){S.user=null;AUTH=null;saveAuth();save();render()}},30*60*1000)};
["click","keydown","touchstart"].forEach(ev=>addEventListener(ev,resetIdle,{passive:true}));resetIdle();
const hv=location.hash.slice(1);if(VIEWS[hv])S.view=hv;
if(!PREVIEW){S.user=null;if(AUTH){root.innerHTML='<p style="padding:40px;text-align:center" class="muted">'+t("loading")+'</p>';loadAll().then(render).catch(()=>{AUTH=null;saveAuth();render()})}else render()}else render();
</script>
</body>
</html>
